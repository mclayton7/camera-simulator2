# CamSim Docker Compose (NVIDIA GPU)
#
# Usage (after scripts/package_for_docker.sh):
#   docker compose -f deploy/docker-compose.yml up --build
#
# Verify output:
#   ffplay udp://239.1.1.1:5004            # needs a multicast route on lo, or
#   CAMSIM_MULTICAST_ADDR=127.0.0.1 ...    # unicast to the host
#   curl localhost:8080/live               # health

services:
  camsim:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: camsim:latest
    container_name: camsim

    # Host networking: multicast output reaches the host network and CIGI
    # from the host reaches the socket. (Docker Desktop has no NVIDIA GPU, so
    # this file targets Linux hosts.)
    network_mode: host

    # One GPU via the NVIDIA Container Toolkit. The image sets
    # NVIDIA_DRIVER_CAPABILITIES=all (Vulkan + NVENC); don't override it here.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # tini as PID 1: reaps Xvfb and forwards SIGTERM to the entrypoint.
    init: true

    environment:
      - CAMSIM_ENCODER=${CAMSIM_ENCODER:-auto}
      - CAMSIM_MULTICAST_ADDR=${CAMSIM_MULTICAST_ADDR:-239.1.1.1}
      - CAMSIM_CESIUM_ION_TOKEN=${CAMSIM_CESIUM_ION_TOKEN:-}
      # Any CAMSIM_* override from docs/configuration.md works here, e.g.
      # - CAMSIM_CIGI_PORT=8888
      # - CAMSIM_VIDEO_BITRATE=4000000

    volumes:
      # Cesium tile cache + UE Saved/ (logs) and the driver shader cache
      # persist, so only the first start pays the cold cost.
      - camsim-data:/var/lib/camsim
      - camsim-cache:/home/camsim/.cache
      # Custom config without rebuilding:
      # - ./my_camsim_config.yaml:/opt/camsim/CamSimTest/camsim_config.yaml:ro

    shm_size: "1gb"

    # UE takes ~10 s to shut down cleanly on SIGTERM; Docker's default is 10 s.
    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

    restart: unless-stopped

volumes:
  camsim-data:
  camsim-cache:
