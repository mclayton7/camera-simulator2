# CamSim Configuration
# All values can be overridden via environment variables (noted per field).

# --- CIGI 3.3 Input (Host -> IG) ---

# Local address to bind the CIGI UDP socket. "0.0.0.0" = all interfaces.
# Env: CAMSIM_CIGI_BIND_ADDR
cigi_bind_addr: "0.0.0.0"

# UDP port for incoming CIGI 3.3 packets from the host simulation.
# Env: CAMSIM_CIGI_PORT
cigi_port: 8888

# --- CIGI 3.3 Response (IG -> Host) ---

# Destination IP for IG -> Host packets (SOF heartbeat, HAT/HOT, LOS).
# Set to the host simulation's IP address.
# Env: CAMSIM_CIGI_RESPONSE_ADDR
cigi_response_addr: "127.0.0.1"

# Destination UDP port for IG -> Host packets.
# Env: CAMSIM_CIGI_RESPONSE_PORT
cigi_response_port: 8889

# --- DIS Protocol (IEEE 1278.1) ---
# Alternative/supplemental entity input via DIS protocol.
# When enabled, FDisReceiver runs alongside FCigiReceiver (both can coexist).
# DIS entities are translated to CamSim's internal format automatically.

# Master toggle: enable DIS receiver thread.
# Env: CAMSIM_DIS_ENABLED
dis:
  enabled: true

  # UDP bind address for incoming DIS PDUs.
  # Env: CAMSIM_DIS_BIND_ADDR
  bind_addr: "0.0.0.0"

  # UDP port for DIS traffic (IEEE 1278.1 default is 3000).
  # Env: CAMSIM_DIS_PORT
  port: 3000

  # Multicast group to join (empty = no multicast, receive unicast only).
  # Env: CAMSIM_DIS_MULTICAST_GROUP
  multicast_group: "239.1.2.3"

  # DIS exercise ID filter. Only PDUs with this exercise ID are accepted.
  # Set to 0 to accept all exercises.
  # Env: CAMSIM_DIS_EXERCISE_ID
  exercise_id: 1

  # This IG's DIS site and application identifiers.
  # Env: CAMSIM_DIS_SITE_ID, CAMSIM_DIS_APP_ID
  site_id: 1
  application_id: 1

  # Entity heartbeat timeout in seconds. DIS has no explicit "remove entity"
  # packet — entities are removed when no Entity State PDU arrives within
  # this interval.
  # Env: CAMSIM_DIS_HEARTBEAT_TIMEOUT
  heartbeat_timeout_sec: 12.0

  # Default CamSim entity type ID for unmapped DIS entity types.
  # Env: CAMSIM_DIS_DEFAULT_ENTITY_TYPE
  default_entity_type_id: 1001

  # Place land platforms (kind 1, domain 1) on the terrain and surface
  # platforms (kind 1, domain 3) on the water; other kinds (munitions,
  # life forms, ...) and domains are used as sent. Set false for a
  # sender that supplies true terrain heights.
  # Env: CAMSIM_DIS_CLAMP_TO_SURFACE
  clamp_to_surface: true

  # DIS entity type → CamSim entity type mapping table.
  # Keys are "kind:domain:country:category:subcategory:specific:extra" strings.
  # Values are CamSim entity type IDs (matching entity_types keys below).
  # Lookup order: exact -> kind:domain:category -> kind:domain ->
  # default_entity_type_id.
  entity_type_map:
    "1:2:225:2:0:0:0": 1001   # Fixed-wing USA (ownship from mavlink-dis-bridge)
    # scripts/send_dis_test.py; kind:domain fallback covers other land and
    # surface platforms.
    "1:1:225:7:0:0:0": 2001   # Truck (land)
    "1:3:225:7:0:0:0": 3001   # Boat (surface)

# --- Phase 26: Standards Compliance (MISB ST 0601.9) ---

phase26:
  # Platform tail number (Tag 4, ISO 646 string, empty = omit)
  # Env: CAMSIM_PLATFORM_TAIL_NUMBER
  platform_tail_number: ""

  # Mission ID (Tag 3), platform designation (Tag 10, e.g. "MQ-1B") and call
  # sign (Tag 59): ISO 646 strings up to 127 characters, empty = omit.
  # Env: CAMSIM_MISSION_ID / CAMSIM_PLATFORM_DESIGNATION / CAMSIM_PLATFORM_CALL_SIGN
  mission_id: ""
  platform_designation: ""
  platform_call_sign: ""

  # Send Tags 90/91 (full-range platform pitch/roll, int32 ±90°) alongside 6/7.
  # Off: misb.js 0.1.30, the downstream reference decoder, decodes them as ~0°.
  # Env: CAMSIM_KLV_FULL_RANGE_ATTITUDE
  klv_full_range_attitude: false

  # Target track gate dimensions in pixels (Tags 43/44, 0 = omit)
  # Env: CAMSIM_TARGET_TRACK_GATE_WIDTH / CAMSIM_TARGET_TRACK_GATE_HEIGHT
  target_track_gate_width:  0
  target_track_gate_height: 0

# --- Terrain readiness gate ---
# Hold frames until Cesium tiles for the view have loaded (startup + teleports).
# Env: CAMSIM_TERRAIN_GATE_ENABLED / _MIN_LOAD_PROGRESS / _TIMEOUT_SEC / _TELEPORT_M
terrain_gate:
  enabled: true
  min_load_progress: 99.0    # percent, 0-100
  timeout_sec: 30.0          # stream anyway after this long
  teleport_distance_m: 5000  # a larger jump in one tick re-arms the gate

# --- Video Output ---

# UDP multicast group (or unicast address) for the MPEG-TS output stream.
# For local testing use "127.0.0.1"; macOS multicast needs a route
# (see scripts/README or MEMORY.md for the sudo route add command).
# Env: CAMSIM_MULTICAST_ADDR
multicast_addr: "239.1.1.1"

# Destination UDP port for the MPEG-TS stream.
# Env: CAMSIM_MULTICAST_PORT
multicast_port: 5004

# Target H.264 bitrate in bits/sec. 4 Mbps suits 1080p/30fps ultrafast.
# Env: CAMSIM_VIDEO_BITRATE
video_bitrate: 4000000

# libx264 encoding preset. Slower presets (fast, medium) give better
# quality at higher CPU cost. Ignored when using NVENC.
# Env: CAMSIM_H264_PRESET
h264_preset: ultrafast

# libx264 tune parameter. "zerolatency" minimises encode latency.
h264_tune: zerolatency

# --- Capture & Readback ---

# Render target dimensions in pixels.
capture_width: 1280
capture_height: 720

# Render, sensor integration and output rate (fps). Values other than 30 also
# override DefaultEngine.ini's FixedFrameRate at startup.
frame_rate: 30.0

# Consecutive FRHIGPUTextureReadback::IsReady() polls required before
# Lock(). Increase on Linux/Vulkan if occasional partial-row tearing.
# Env: CAMSIM_READBACK_READY_POLLS
readback_ready_polls: 1

# Horizontal field of view in degrees. Used for KLV metadata and Cesium
# tile preloading. Overridden per-frame by CIGI View Definition packets.
hfov_deg: 60.0

# --- Encoder ---

# Video codec: "h264" (default) or "h265" (STANAG 4609 Ed4).
# Env: CAMSIM_VIDEO_CODEC
video_codec: h264

# Encoder implementation: "auto" tries NVENC, then libx264/libx265.
# Explicit values: "nvenc", "videotoolbox", "libx264", "libx265".
# "videotoolbox" (macOS hardware) is opt-in: it can overshoot the bitrate
# cap on very noisy scenes.
# Env: CAMSIM_ENCODER
encoder: auto

# Encoder watchdog action when no frames are written for
# encoder_watchdog_interval_ticks: reconnect, log_only, fail_fast.
# Env: CAMSIM_ENCODER_WATCHDOG_POLICY
encoder_watchdog_policy: reconnect

# Tick interval for encoder watchdog and runtime health checks.
# Env: CAMSIM_ENCODER_WATCHDOG_INTERVAL_TICKS
encoder_watchdog_interval_ticks: 150

# Maximum encoder reconnect attempts before RequestExit (0 = unlimited).
watchdog_max_reconnects: 3

# --- Geospatial (Cesium) ---

# Terrain/imagery provider selector. Currently supported: "cesium".
# Env: CAMSIM_TERRAIN_PROVIDER / CAMSIM_IMAGERY_PROVIDER
terrain_provider: cesium
imagery_provider: cesium

# Enable Cesium's per-frame tile selection logging (very verbose).
# Shows tiles visited, rendered, culled, queue lengths per frame.
# Env: CAMSIM_LOG_TILE_STATS
log_tile_stats: false

# Multiplier on hfov_deg reported to CesiumCameraManager prefetch camera.
# >1.0 pre-fetches tiles outside the frustum to reduce pop-in on pan.
# Lower values free loading slots for visible tiles (1.5 = 50% extra).
# Env: CAMSIM_TILE_FOV_SCALE
tile_preload_fov_scale: 1.5

# Maximum concurrent Cesium tile HTTP requests. Higher = faster initial
# load at the cost of network/CPU. Keep ≤20 for real-time 30fps.
# Env: CAMSIM_MAX_TILE_LOADS
max_simultaneous_tile_loads: 20

# Cesium LOD quality: lower = sharper terrain. Cesium default is 16;
# for quantized-mesh terrain (CWT), value is internally divided by 8,
# so 8.0 → effective 1.0 px error (good balance of quality vs perf).
# Previous 2.0 caused 44K+ loaded tiles and ~18 fps on macOS.
# Env: CAMSIM_MAX_SSE
maximum_screen_space_error: 16.0

# Detail kept for tiles outside the view (higher = coarser). After a gimbal snap
# the new view shows these tiles until they refine. 0 = same as
# maximum_screen_space_error: snaps land on full-detail tiles (Yosemite, M1 Pro:
# ~60% more tiles, ~930 MB; needs frustum_culling: false). The old value, 200,
# left a third of the view coarse for ~2 s after a 90-degree snap. Below a 60-degree HFOV it
# is scaled by tan(30) / tan(HFOV / 2) at run time, so zooming in doesn't load
# zoomed-in detail all the way round the camera.
# Env: CAMSIM_CULLED_SSE
culled_screen_space_error: 0

# Cesium's tile-selection frustum culling (UE still culls rendering). Off:
# Cesium applies culled_screen_space_error only when this is off, so with it on,
# tiles outside the view stay coarse and a gimbal snap shows them for ~2 s.
# Off costs ~2-3 ms of game thread and more streaming hitches (SF bench, M1
# Pro);
# set true for smooth steady flight when the gimbal doesn't snap.
# Env: CAMSIM_FRUSTUM_CULLING
frustum_culling: false

# Cesium tile cache budget in MB (per tileset). 0 = Cesium default (uncapped).
# Large cache avoids re-downloading tiles when revisiting areas; sized for the
# off-screen tiles kept at full detail (culled_screen_space_error).
# Env: CAMSIM_MAX_CACHED_MB
maximum_cached_bytes_mb: 2048

# Max descendant tiles to load simultaneously (Cesium default 20; higher = better low-alt detail).
# Env: CAMSIM_LOADING_DESCENDANT_LIMIT
loading_descendant_limit: 20

# Cesium's dithered LOD crossfade (UseLodTransitions): hides tile LOD pops.
# Needs temporal AA (TSR, the primary view's anti-aliasing) to resolve the dither.
# Off by default: while on, Cesium updates every tile in the render set each
# frame (off-screen tiles included): ~6 ms of game thread and twice the
# streaming hitches with culled_screen_space_error at full detail.
# Env: CAMSIM_USE_LOD_TRANSITIONS
use_lod_transitions: false

# Duration of LOD crossfade in seconds (only used when use_lod_transitions=true).
# Env: CAMSIM_LOD_TRANSITION_LENGTH
lod_transition_length: 0.5

# Cook collision meshes for Cesium tiles. CIGI HAT/HOT and LOS queries and the
# KLV frame centre (Tags 21, 23-25, 78) are line traces against them; with this
# off they never hit the terrain.
# Env: CAMSIM_CREATE_PHYSICS_MESHES
create_physics_meshes: true

# --- Camera Start Position (WGS-84) ---
# Initial camera pose before the first CIGI Entity Control packet.

# Decimal degrees. Default: Yuma, AZ area.
# Env: CAMSIM_START_LAT / CAMSIM_START_LON
start_latitude: 32.97679168129847
start_longitude: -114.26653388625711

# Height above WGS-84 ellipsoid in metres.
# Env: CAMSIM_START_ALT
start_altitude: 1500.0

# Initial heading [0, 360) degrees.
# Env: CAMSIM_START_YAW
start_yaw: 200.0

# Initial pitch in degrees. Negative = looking down.
# Env: CAMSIM_START_PITCH
start_pitch: 0.0

# Initial roll in degrees.
# Env: CAMSIM_START_ROLL
start_roll: 0.0

# --- Sim clock (UTC) ---
# One clock drives the sun, KLV Tag 2 and ground truth.
# It starts at the wall-clock time unless one of these is set, and a CIGI
# Celestial Sphere Control (Date/Time Valid) sets it at runtime.
# Start date and time, ISO 8601. Env: CAMSIM_START_DATETIME
# start_datetime: "2025-03-01T06:30:00Z"
# Start time of day (UTC hours 0-24) on today's date. Env: CAMSIM_START_HOUR
# start_hour: 12.0
# 1 = real time, 0 = frozen, >1 faster than real time. Env: CAMSIM_SIM_TIME_RATE
sim_time_rate: 1.0

# CIGI Entity ID that drives the camera. All other entity IDs are managed
# by the entity renderer. Must match --entity-id in send_cigi_test.py.
# Env: CAMSIM_CAMERA_ENTITY_ID
camera_entity_id: 1

# --- First-Person View (Phase 22G) ---
# Attach the camera to a character entity at eye height.
# Set to a valid EntityId to activate FPS mode from config.
# Can also be activated dynamically via CIGI ViewControl EntityId.
# Env: CAMSIM_FPS_ENTITY_ID
fps_entity_id: 0

# Eye height above entity ground position in metres.
# Env: CAMSIM_FPS_EYE_HEIGHT_M
fps_eye_height_m: 1.7

# --- Gimbal ---

# Maximum gimbal slew rate in deg/s. 0 = unlimited (instant snap).
# Applies to the Articulated Part slew on all three axes (View Control snaps).
# Env: CAMSIM_GIMBAL_MAX_SLEW_RATE
gimbal_max_slew_rate: 0.0

# Physical axis limits in degrees. Applied after every slew update. Yaw is
# unwound to -180..180 first (CIGI sends 0-360). Limits spanning 360 deg allow
# continuous yaw (slews take the short way across 180); narrower ones are stops.
# Env: CAMSIM_GIMBAL_PITCH_MIN / _PITCH_MAX / _YAW_MIN / _YAW_MAX
gimbal_pitch_min: -90.0
gimbal_pitch_max: 30.0
gimbal_yaw_min: -180.0
gimbal_yaw_max: 180.0

# --- Sensor FOV Presets ---
# Ordered wide->narrow FOV values (degrees). Sensor Control Gain (0.0=wide,
# 1.0=narrow) selects by index. Empty array = ignore Gain, use ViewDef FOV.
# Env: CAMSIM_SENSOR_FOV_PRESETS="60,20,5" ("none" / "off" / "[]" = empty)
sensor_fov_presets:
  - 60.0
  - 20.0
  - 5.0

# --- Output Views (multi-stream) ---
# Optional fan-out of the captured frame to multiple MPEG-TS outputs.
# Empty/omitted = single stream using root multicast_*/video settings.
# hfov_deg: 0 = use live HFOV; nonzero = digital zoom center crop.
# When CAMSIM_MULTICAST_ADDR/PORT env vars are set, they override all
# per-view routes (useful for local unicast testing).
output_views:
  - view_id: 0
    enabled: true
    multicast_addr: "239.1.1.1"
    multicast_port: 5004
    video_bitrate: 4000000
    h264_preset: ultrafast
    h264_tune: zerolatency
    hfov_deg: 0.0

# --- ML Training Data (Phase 17) ---
# Enable structured training data output: COCO bounding boxes + 16-bit depth PNGs.
# Env: CAMSIM_ML_ENABLED, CAMSIM_ML_OUTPUT_DIR
ml_training:
  # Master enable; all other settings are ignored when false.
  # Env: CAMSIM_ML_ENABLED
  enabled: false

  # Output root directory. Relative paths are anchored to the process base dir.
  # Subdirectories created automatically: depth/.
  # Env: CAMSIM_ML_OUTPUT_DIR
  output_dir: ml_output

  # Write 16-bit grayscale depth PNG per frame (SCS_SceneDepth, cm → 16-bit quantized).
  # Env: CAMSIM_ML_DEPTH_ENABLED
  depth_map: true

  # Write per-frame entity bounding box annotations.
  # Env: CAMSIM_ML_BBOX_ENABLED
  bounding_boxes: true

  # COCO JSONL format (one JSON object per frame, streamable).
  # Env: CAMSIM_ML_COCO_ENABLED
  coco_export: true

  # Drop annotations with fewer visible (unoccluded, in-frame) pixels than this.
  # Fully hidden vehicles are never labelled. Env: CAMSIM_ML_MIN_VISIBLE_PIXELS
  min_visible_pixels: 1

  # COCO RLE "segmentation" (modal mask) per annotation; the bulk of each line.
  # Env: CAMSIM_ML_SEGMENTATION_ENABLED
  segmentation: true

  # Write annotations every N frames (1 = every frame, 30 = 1 Hz at 30fps).
  # Env: CAMSIM_ML_INTERVAL_FRAMES
  annotation_interval_frames: 1

  # Far plane for depth quantization (0 m → 0, far_plane_m → 65535).
  # Env: CAMSIM_ML_DEPTH_FAR_PLANE_M
  depth_far_plane_m: 5000.0

# --- Entity Scale ---
# Runtime controls for large-scene scaling (LOD/culling/throttle).
# Env: CAMSIM_MAX_ENTITIES, CAMSIM_ENTITY_MAX_DRAW_DISTANCE_M,
#      CAMSIM_ENTITY_TICK_RATE_HZ, CAMSIM_ENTITY_DEFAULT_MAX_UPDATE_RATE_HZ

# Maximum simultaneous entities. Env: CAMSIM_MAX_ENTITIES
max_entities: 500


entity_scale:
  # Draw/cull distance in metres. 0 = no distance culling.
  max_draw_distance_m: 0.0
  # Entity actor tick rate in Hz. 0 = every frame.
  tick_rate_hz: 0.0
  # Global cap for pose-apply rate (reduces transform churn). 0 = uncapped.
  default_max_update_rate_hz: 0.0
  # Per-entity overrides keyed by EntityId string.
  max_update_rate_hz_overrides:
    "1": 30.0

# --- Sensor Modes (per-waveband) ---
# Physical sensor model (ROADMAP 3B.2): optics -> electrons -> detector noise -> ADC -> display.
# SensorId 0=EO, 1=IR. See docs/configuration.md for the full field reference table.
sensor_modes:
  eo:
    # ROADMAP 3B.2: sensor-class preset supplies optics/detector defaults (see the
    # commented blocks below for the values it sets); seed drives the per-mode PCG
    # noise streams (detector noise, defects).
    preset: eo_hd_cmos
    seed: 1
    # optics:                      # 1080p industrial CMOS (eo_hd_cmos preset values)
    #   f_number: 4.0
    #   pixel_pitch_um: 2.9
    #   wavelength_um: 0.55
    #   extra_blur_px: 0.0
    #   vignetting_exponent: 4.0
    #   k1: 0.0
    #   k2: 0.0
    # detector:
    #   type: photon
    #   full_well_e: 10000
    #   read_noise_e: 2
    #   prnu: 0.01
    #   dsnu_e: 1
    #   dark_current_e_s: 5
    #   max_analog_gain_db: 30
    #   adc_bits: 12
    #   hot_pixel_fraction: 1e-5
    #   dead_pixel_fraction: 1e-5
    #   band_lo_um: 0.4
    #   band_hi_um: 0.7
    # ROADMAP 3B — auto-exposure (GPU sensor path), calibrated 2026-09-27 on the bench shots
    # (M1 Pro, SF). Scene median (log2 of absolute scene-linear luminance): daylight 10.9–12.4,
    # dawn 9.4, dusk 8.9, night_slant 6.6. target_grey 0.18 exposes the median to 18% grey
    # (daylight gain -13.4…-14.9, mean luma 105–114, <0.1% clipped). max_photon_gain_ev -12.5
    # makes night_slant clamp the photon gain (3B.1 mean luma 26); dawn/dusk clamp slightly too
    # (luma 93/78). Past it the AE adds analog gain up to detector.max_analog_gain_db (3B.2).
    exposure:
      min_gain_ev: -20
      max_photon_gain_ev: -12.5
      target_grey: 0.18
      highlight_percentile: 0.99
      lag_frames: 2
      manual_gain_ev: -12
  ir:
    # ROADMAP 3B.2: sensor-class preset (default: cooled MWIR InSb). Switch to
    # `lwir_uncooled` for an uncooled VOx microbolometer.
    preset: mwir_cooled
    seed: 1
    # optics:                      # 640x512 cooled MWIR InSb (mwir_cooled preset values)
    #   f_number: 4.0
    #   pixel_pitch_um: 15.0
    #   wavelength_um: 4.0
    #   extra_blur_px: 0.0
    #   vignetting_exponent: 4.0
    #   k1: 0.0
    #   k2: 0.0
    # detector:
    #   type: photon
    #   full_well_e: 7000000
    #   read_noise_e: 400
    #   prnu: 0.001
    #   dsnu_e: 2000               # residual after NUC (cooled)
    #   dark_current_e_s: 0
    #   max_analog_gain_db: 0      # no analog gain: AGC drives IR exposure
    #   adc_bits: 14
    #   hot_pixel_fraction: 1e-4
    #   dead_pixel_fraction: 1e-4
    #   band_lo_um: 3.0              # thermal radiance band (ROADMAP 4A)
    #   band_hi_um: 5.0
    # lwir_uncooled (640x512 VOx) would instead set:
    #   optics: {f_number: 1.2, pixel_pitch_um: 12.0, wavelength_um: 10.0}
    #   detector: {type: microbolometer, temporal_noise: 0.004, pixel_fpn: 0.003,
    #              column_fpn: 0.0015, row_fpn: 0.001, max_analog_gain_db: 0, adc_bits: 14,
    #              hot_pixel_fraction: 1e-4, dead_pixel_fraction: 1e-4,
    #              band_lo_um: 8.0, band_hi_um: 12.0}
    #
    # Radiance-based AGC (percentile stretch)
    agc_enabled: true
    agc_low_percentile: 0.01
    agc_high_percentile: 0.99
    agc_lag_frames: 2           # frames for AGC convergence (0 = instant)
    agc_max_display_gain: 40.0  # ROADMAP 4A: cap on the thermal (radiance) AGC's display gain
    # ROADMAP 3B — auto-exposure (GPU sensor path). With agc_enabled the AE still sets the
    # photon gain (integration time, hence the noise level) and the AGC stretches the
    # percentile band on the normalised signal; kept at the uncompensated defaults.
    exposure:
      min_gain_ev: -20
      max_photon_gain_ev: -6
      target_grey: 0.18
      highlight_percentile: 0.99
      lag_frames: 2
      manual_gain_ev: -12
    # ROADMAP 4A — thermal radiance AE (signal = L / B(300 K)): exposes a 300 K scene to mid-range.
    # The exposure: block above stays in use for thermal.enabled: false (luminance proxy).
    thermal_exposure:
      min_gain_ev: -8
      max_photon_gain_ev: 0
      target_grey: 0.5
      highlight_percentile: 0.99
      lag_frames: 2
      manual_gain_ev: -1
# NVG (formerly sensor_modes.nvg, SensorId 2) was removed — ROADMAP 3B.2.

# --- Rendering Quality (Phase 24) ---

rendering_quality:
  # 24A: Entity shadow casting and contact shadows
  # Env: CAMSIM_ENTITY_SHADOWS / CAMSIM_CONTACT_SHADOWS / CAMSIM_CONTACT_SHADOW_LENGTH
  entity_shadows: true
  contact_shadows: false
  contact_shadow_length: 0.1

  # 24B: Ambient occlusion (Lumen GTAO) intensity and world-space radius
  # Env: CAMSIM_AO_INTENSITY / CAMSIM_AO_RADIUS
  ao_intensity: 0.0
  ao_radius: 200.0

  # Ray tracing backend (BLAS/TLAS allocation). Off by default for performance.
  # Enable on NVIDIA builds that want RT features. Requires project restart.
  # Env: CAMSIM_RT_ENABLED
  rt_enabled: false

  # 24E: Shadow distance and Virtual Shadow Map quality
  # Env: CAMSIM_SHADOW_DISTANCE_SCALE / CAMSIM_VSM_RESOLUTION_BIAS / CAMSIM_VSM_MAX_PAGES
  shadow_distance_scale: 1.0
  vsm_resolution_bias: 0
  vsm_max_physical_pages: 2048

  # 24F: TSR screen percentage (100=native, >100=super-sample for crisp entity edges,
  # <100=render smaller and let TSR upscale; 75 saves ~25% GPU on an M1 Pro with no
  # visible difference — ROADMAP 3A).
  # Env: CAMSIM_TSR_SCREEN_PERCENTAGE
  tsr_screen_percentage: 100

# --- Weather & Atmosphere (Phase 18) ---
# All effects default to false (opt-in).
phase18:
  # 18C Second fog layer (low-lying ground mist via UE ExponentialHeightFog SecondFogData)
  second_fog: false
  fog_density: 0.02
  fog_height_falloff: 0.2
  # 18K Visibility range (metres)
  visibility_range_m: 10000.0

  # 18A/18B Volumetric cloud shadow (cloud actor must exist in the level)
  volumetric_clouds: false
  cloud_shadow_strength: 0.6   # [0,1] intensity of cloud shadow projected onto terrain

# Ocean surface for boats (ROADMAP 2.6). Sea level = EGM96 geoid undulation +
# CIGI tide offset; waves come from `beaufort`/`wave_direction_deg` below until
# a CIGI Wave Control packet enables a host wave (IDs 0-3), which then wins.
ocean:
  enabled: true                          # CAMSIM_OCEAN_ENABLED — startup only
  beaufort: 3.0                          # CAMSIM_OCEAN_BEAUFORT — 0-12, fractional
  wave_direction_deg: 270.0              # CAMSIM_OCEAN_WAVE_DIR — direction waves come FROM, true north
  choppiness: 0.5                        # CAMSIM_OCEAN_CHOPPINESS — 0=sine, 1=steepest without looping
  vessel_motion: true                    # CAMSIM_OCEAN_MOTION_ENABLED — boats pitch/roll/heave with the waves
  vessel_motion_scale: 1.0               # CAMSIM_OCEAN_MOTION_SCALE
  max_radius_km: 400.0                   # CAMSIM_OCEAN_MAX_RADIUS_KM — horizon cap for the ocean mesh
  water_temperature_c: 15.0              # CAMSIM_OCEAN_WATER_TEMPERATURE_C — initial; CIGI Maritime Surface overrides
  material: "/Game/Ocean/M_Ocean"        # startup only

# --- Thermal radiance for IR (ROADMAP 4A, docs/thermal.md) ---
# IR mode renders in-band (MWIR/LWIR) radiance from per-pixel surface temperature and emissivity.
# enabled: false restores the 3B.2 luminance proxy (startup only; restart to A/B compare).
thermal:
  enabled: true                 # CAMSIM_THERMAL_ENABLED
  air_temperature_c: 15.0       # CAMSIM_THERMAL_AIR_TEMPERATURE_C — daily mean until CIGI Atmosphere Control sets it
  air_diurnal_swing_k: 8.0      # CAMSIM_THERMAL_AIR_DIURNAL_SWING_K — peak-to-peak, peak at 15:00 local solar
  extinction_per_km:
    mwir: 0.15                  # CAMSIM_THERMAL_EXTINCTION_MWIR
    lwir: 0.10                  # CAMSIM_THERMAL_EXTINCTION_LWIR
  fog_ir_factor: 0.4            # CAMSIM_THERMAL_FOG_IR_FACTOR — beta_fog = 3.912 / V_km * factor
  # materials:                  # overrides of / additions to the built-in classes (yaml only)
  #   asphalt:
  #     albedo: 0.1
  #     emissivity: 0.95
  #     thermal_inertia: 1500   # J m^-2 K^-1 s^-1/2
  #     convection_w_m2k: 10
  #     k_fast: 0.02            # K per W m^-2 absorbed above the class reference
  #     temperature: model      # model | water

# Phase 27 — Performance & Optimization
performance:
  # 27G Texture streaming pool (0 = engine default)
  texture_pool_budget_mb: 0                     # CAMSIM_PERF_TEXTURE_POOL_MB

  # Phase 28G: Per-frame pipeline latency tracking (P50/P95/P99 to /metrics).
  # Env: CAMSIM_TRACK_PIPELINE_LATENCY
  track_pipeline_latency: false

# --- Cesium Backend ---
# Ion server, terrain source, and imagery overlay.
# Set ion_token to authenticate against Cesium ion (https://ion.cesium.com/tokens).
# For air-gapped deployments, set ion_portal_url and ion_api_url to your self-hosted server.
# Env: CAMSIM_CESIUM_ION_PORTAL_URL, CAMSIM_CESIUM_ION_API_URL, CAMSIM_CESIUM_ION_TOKEN,
#      CAMSIM_CESIUM_TERRAIN_SOURCE, CAMSIM_CESIUM_TERRAIN_ION_ASSET_ID, CAMSIM_CESIUM_TERRAIN_URL,
#      CAMSIM_CESIUM_IMAGERY_SOURCE, CAMSIM_CESIUM_IMAGERY_ION_ASSET_ID,
#      CAMSIM_CESIUM_IMAGERY_WMS_URL, CAMSIM_CESIUM_IMAGERY_WMS_LAYERS,
#      CAMSIM_CESIUM_IMAGERY_WMS_TILE_WIDTH, CAMSIM_CESIUM_IMAGERY_WMS_TILE_HEIGHT,
#      CAMSIM_CESIUM_IMAGERY_MAX_SSE, CAMSIM_CESIUM_IMAGERY_MAX_TEXTURE_SIZE,
#      CAMSIM_CESIUM_IMAGERY_MAX_TILE_LOADS
cesium:
  ion_portal_url: "https://ion.cesium.com"   # UCesiumIonServer::ServerUrl (OAuth/browser)
  ion_api_url:    "https://api.cesium.com"    # UCesiumIonServer::ApiUrl (REST tile API)
  ion_token: ""                               # leave empty to use level asset default

  terrain:
    source: cesium_ion    # cesium_ion | url | flat
    ion_asset_id: 1       # Cesium World Terrain (ignored unless source: cesium_ion)
    url: ""               # quantized-mesh endpoint (ignored unless source: url)

  imagery:
    source: cesium_ion    # cesium_ion | wms | none
    ion_asset_id: 2       # Bing Maps Aerial (ignored unless source: cesium_ion)
    wms_url: ""           # ignored unless source: wms
    wms_layers: ""        # ignored unless source: wms
    wms_tile_width: 256
    wms_tile_height: 256
    # Overlay SSE: controls imagery resolution. 2.0 = 1 source px covers 2x2 screen px,
    # 1.0 = 1:1 pixel mapping (sharpest for ISR). Plugin default 2.0.
    # Env: CAMSIM_CESIUM_IMAGERY_MAX_SSE
    maximum_screen_space_error: 2.0
    # Maximum texture size per raster overlay tile (pixels per side).
    # 2048 is Cesium plugin default. 4096 doubles texel density but is overkill at 720p.
    # Env: CAMSIM_CESIUM_IMAGERY_MAX_TEXTURE_SIZE
    maximum_texture_size: 2048
    # Maximum simultaneous HTTP requests for imagery overlay tiles.
    # Plugin default 20; keep low for real-time 30fps.
    # Env: CAMSIM_CESIUM_IMAGERY_MAX_TILE_LOADS
    maximum_simultaneous_tile_loads: 20

# --- Security Metadata (MISB ST 0102) ---
# Embedded in every KLV packet as ST 0601 Tag 48.
# Required for STANAG 4609 compliance even for unclassified output.
# Env: CAMSIM_SECURITY_CLASSIFICATION, CAMSIM_SECURITY_CLASSIFYING_COUNTRY,
#      CAMSIM_SECURITY_OBJECT_COUNTRY
security_metadata:
  classification: "UNCLASSIFIED"
  classifying_country: "//US"
  object_country_codes: "US"
  caveats: ""
  releasing_instructions: ""

# --- Recording & Playback ---
# Record CIGI input and/or video output for offline analysis and replay.
# Env: CAMSIM_CIGI_RECORD_PATH, CAMSIM_VIDEO_RECORD_PATH, CAMSIM_CIGI_PLAYBACK_PATH
recording:
  # Binary file: raw CIGI UDP datagrams with timestamps for deterministic replay.
  cigi_record_path: ""
  # Local MPEG-TS file: H.264/H.265 video + KLV metadata mirror of the UDP stream.
  video_record_path: ""
  # When set, CigiReceiver reads from this file instead of UDP socket (playback mode).
  cigi_playback_path: ""

# --- Phase 28: Operational Hardening ---

# Structured JSON logging sidecar for ELK/Datadog/Splunk ingestion.
# Set to a file path to enable (e.g., /var/log/camsim.jsonl).
# Env: CAMSIM_STRUCTURED_LOG_PATH
operational:
  structured_log_path: ""

  # Max file size in MB before rotation (close, rename .1, reopen).
  # Env: CAMSIM_STRUCTURED_LOG_MAX_MB
  structured_log_max_mb: 100

  # HTTP health endpoints for Kubernetes liveness/readiness probes.
  # GET /live — 200 if game loop ticking, 503 if stalled
  # GET /ready — 200 when encoder + CIGI + first frame all OK
  # GET /metrics — Prometheus exposition format
  # Env: CAMSIM_HEALTH_HTTP_ENABLED / CAMSIM_HEALTH_HTTP_PORT
  health_http_enabled: true
  health_http_port: 8080

  # 3A: GET /snapshot on the health port returns the next grabbed frame as PNG
  # (lossless, before sensor effects). For the bench harness; off in production.
  # Env: CAMSIM_SNAPSHOT_ENDPOINT_ENABLED
  snapshot_endpoint_enabled: false

  # 3A: per-frame JSONL render stats (frame time, thread/GPU time, tiles, SSE).
  # Empty = disabled. Env: CAMSIM_FRAME_STATS_PATH
  frame_stats_path: ""

# --- Render path (ROADMAP 3A) ---
# The sensor is always the primary view (the game viewport's view: TSR, one
# scene render per frame). Since 3B.2 this is the only render path.
render:
  # A pose jump above either threshold in one frame resets TSR history (camera cut).
  # Env: CAMSIM_RENDER_CAMERA_CUT_DISTANCE_M / CAMSIM_RENDER_CAMERA_CUT_ANGLE_DEG
  camera_cut_distance_m: 500.0
  camera_cut_angle_deg: 30.0

  # Rebase the Cesium georeference when the camera is this far (m) from the
  # origin, keeping "up" = +Z and coordinates small. 0 = disabled.
  # Env: CAMSIM_RENDER_ORIGIN_SHIFT_DISTANCE_M
  origin_shift_distance_m: 20000.0

# --- Entity Types ---
# Maps CIGI EntityType uint16 to asset paths.
# Use .gltf/.glb paths (relative to entities/) for runtime loading,
# or /Game/... UE content paths for cooked assets.
# "scale": uniform scale factor (default 1.0).
# "rotation": pitch/yaw/roll offset in degrees to correct model-space orientation.
# Phase 22D: "animated: true" + "anim_blueprint:" for skeletal character animation.
# Phase 22A: "entity_category:" for type classification ("character"|"vehicle"|"").
entity_types:
  "1001":
    mesh: f16/f16-c_falcon.glb
    skeletal: false
    scale: 1.0
    rotation:
      pitch: 0.0
      yaw: 0.0
      roll: 0.0
  # DIS land platforms (dis.entity_type_map). Footprint feeds the terrain
  # clamp. Ural-4320 6x6 cargo truck, CC BY 4.0 (entities/truck/LICENSE.md).
  # glTF bow is +Z, which glTFRuntime maps to UE -X: yaw 180 turns it to +X.
  "2001":
    mesh: truck/ural_4320.glb
    skeletal: false
    class_name: truck
    scale: 1.0
    rotation:
      pitch: 0.0
      yaw: 180.0
      roll: 0.0
    half_length_m: 3.78
    half_beam_m: 1.53
    # thermal_material: vehicle_paint  # ROADMAP 4A default; thermal_offset_k defaults to +8 K for land/sea vehicles
  # DIS surface platforms. Mako 655 rigid-hull inflatable (fast rescue
  # craft), CC BY 4.0 (entities/boat/LICENSE.md). Scale 1.19: real 6.55 m.
  "3001":
    mesh: boat/mako_655.glb
    skeletal: false
    class_name: boat
    scale: 1.19
    rotation:
      pitch: 0.0
      yaw: 180.0
      roll: 0.0
    # Draft: keel ~0.14 m above the origin; sink it to ~0.35 m below
    # the water (the entity origin sits on the surface).
    z_offset_m: -0.49
    half_length_m: 3.27
    half_beam_m: 1.31
    # thermal_material: vehicle_paint  # ROADMAP 4A default; thermal_offset_k defaults to +8 K for land/sea vehicles
  # Example animated character entity (Phase 22D).
  # Requires skeletal mesh + Animation Blueprint assets in UE editor (see TODO.md).
  # "1010":
  #   mesh: /Game/Characters/SK_Soldier.SK_Soldier
  #   skeletal: true
  #   animated: true
  #   anim_blueprint: /Game/Characters/ABP_Soldier.ABP_Soldier_C
  #   entity_category: character
  #   scale: 1.0
  #   rotation:
  #     pitch: 0.0
  #     yaw: 0.0
  #     roll: 0.0
