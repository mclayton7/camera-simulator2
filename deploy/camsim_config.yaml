# CamSim Configuration
# All values can be overridden via environment variables (noted per field).

# --- CIGI 3.3 Input (Host -> IG) ---

# Local address to bind the CIGI UDP socket. "0.0.0.0" = all interfaces.
# Env: CAMSIM_CIGI_BIND_ADDR
cigi_bind_addr: "0.0.0.0"

# UDP port for incoming CIGI 3.3 packets from the host simulation.
# Env: CAMSIM_CIGI_PORT
cigi_port: 8888

# --- CIGI 3.3 Response (IG -> Host) ---

# Destination IP for IG -> Host packets (SOF heartbeat, HAT/HOT, LOS).
# Set to the host simulation's IP address.
# Env: CAMSIM_CIGI_RESPONSE_ADDR
cigi_response_addr: "127.0.0.1"

# Destination UDP port for IG -> Host packets.
# Env: CAMSIM_CIGI_RESPONSE_PORT
cigi_response_port: 8889

# --- Video Output ---

# UDP multicast group (or unicast address) for the MPEG-TS output stream.
# For local testing use "127.0.0.1"; macOS multicast needs a route
# (see scripts/README or MEMORY.md for the sudo route add command).
# Env: CAMSIM_MULTICAST_ADDR
multicast_addr: "239.1.1.1"

# Destination UDP port for the MPEG-TS stream.
# Env: CAMSIM_MULTICAST_PORT
multicast_port: 5004

# Target H.264 bitrate in bits/sec. 4 Mbps suits 1080p/30fps ultrafast.
# Env: CAMSIM_VIDEO_BITRATE
video_bitrate: 4000000

# libx264 encoding preset. Slower presets (fast, medium) give better
# quality at higher CPU cost. Ignored when using NVENC.
# Env: CAMSIM_H264_PRESET
h264_preset: ultrafast

# libx264 tune parameter. "zerolatency" minimises encode latency.
h264_tune: zerolatency

# --- Capture & Readback ---

# Render target dimensions in pixels.
capture_width: 1920
capture_height: 1080

# Fixed tick rate. Must match DefaultEngine.ini FixedFrameRate setting.
frame_rate: 30.0

# Force a red/blue channel swap on GPU readback. Enable if the platform
# reports BGRA but delivers RGBA (rare).
# Env: CAMSIM_SWAP_RB_READBACK (0 or 1)
swap_rb_readback: false

# Consecutive FRHIGPUTextureReadback::IsReady() polls required before
# Lock(). Increase on Linux/Vulkan if occasional partial-row tearing.
# Env: CAMSIM_READBACK_READY_POLLS
readback_ready_polls: 2

# Override readback byte order: auto, bgra, rgba, argb, abgr.
# "auto" uses the render target's native format.
# Env: CAMSIM_READBACK_FORMAT
readback_format: auto

# Horizontal field of view in degrees. Used for KLV metadata and Cesium
# tile preloading. Overridden per-frame by CIGI View Definition packets.
hfov_deg: 60.0

# --- Encoder ---

# Video codec: "h264" (default) or "h265" (STANAG 4609 Ed4).
# Env: CAMSIM_VIDEO_CODEC
video_codec: h264

# Encoder implementation: "auto" tries NVENC first, falls back to
# libx264/libx265. Explicit values: "nvenc", "libx264", "libx265".
# Env: CAMSIM_ENCODER
encoder: auto

# Encoder watchdog action when no frames are written for
# encoder_watchdog_interval_ticks: reconnect, log_only, fail_fast.
# Env: CAMSIM_ENCODER_WATCHDOG_POLICY
encoder_watchdog_policy: reconnect

# Tick interval for encoder watchdog and runtime health checks.
# Env: CAMSIM_ENCODER_WATCHDOG_INTERVAL_TICKS
encoder_watchdog_interval_ticks: 150

# Maximum encoder reconnect attempts before RequestExit (0 = unlimited).
watchdog_max_reconnects: 3

# --- Geospatial (Cesium) ---

# Terrain/imagery provider selector. Currently supported: "cesium".
# Env: CAMSIM_TERRAIN_PROVIDER / CAMSIM_IMAGERY_PROVIDER
terrain_provider: cesium
imagery_provider: cesium

# Multiplier on hfov_deg reported to CesiumCameraManager. >1.0 pre-fetches
# tiles outside the visible frustum to reduce pop-in on camera pan.
# Env: CAMSIM_TILE_FOV_SCALE
tile_preload_fov_scale: 2.0

# Maximum concurrent Cesium tile HTTP requests. Higher = faster initial
# load at the cost of network/CPU.
# Env: CAMSIM_MAX_TILE_LOADS
max_simultaneous_tile_loads: 40

# Cesium LOD quality: lower = sharper terrain. Cesium default is 16;
# 2.0 is high quality for ISR imagery (1.0 = maximum sharpness).
# Env: CAMSIM_MAX_SSE
maximum_screen_space_error: 2.0

# Cesium tile cache budget in MB. 0 = Cesium default (uncapped).
# Env: CAMSIM_MAX_CACHED_MB
maximum_cached_bytes_mb: 2048

# --- Camera Start Position (WGS-84) ---
# Initial camera pose before the first CIGI Entity Control packet.

# Decimal degrees. Default: Yuma, AZ area.
# Env: CAMSIM_START_LAT / CAMSIM_START_LON
start_latitude: 32.97679168129847
start_longitude: -114.26653388625711

# Height above WGS-84 ellipsoid in metres.
# Env: CAMSIM_START_ALT
start_altitude: 1500.0

# Initial heading [0, 360) degrees.
# Env: CAMSIM_START_YAW
start_yaw: 200.0

# Initial pitch in degrees. Negative = looking down.
# Env: CAMSIM_START_PITCH
start_pitch: 0.0

# Initial roll in degrees.
# Env: CAMSIM_START_ROLL
start_roll: 0.0

# Time of day (0-24). Sets sun position before a CIGI Celestial Control.
# Env: CAMSIM_START_HOUR
start_hour: 12.0

# CIGI Entity ID that drives the camera. All other entity IDs are managed
# by the entity renderer. Must match --entity-id in send_cigi_test.py.
camera_entity_id: 0

# --- Gimbal ---

# Maximum gimbal slew rate in deg/s. 0 = unlimited (instant snap).
# Applies to both yaw and pitch axes.
gimbal_max_slew_rate: 0.0

# Physical axis limits in degrees. Applied after every slew update.
gimbal_pitch_min: -90.0
gimbal_pitch_max: 30.0
gimbal_yaw_min: -180.0
gimbal_yaw_max: 180.0

# --- Sensor FOV Presets ---
# Ordered wide->narrow FOV values (degrees). Sensor Control Gain (0.0=wide,
# 1.0=narrow) selects by index. Empty array = ignore Gain, use ViewDef FOV.
sensor_fov_presets:
  - 60.0
  - 20.0
  - 5.0

# --- Sensor Quality Profile ---
# Global quality profile applied on top of per-waveband sensor_modes.
# Preset: low|medium|high|ultra|custom. Numeric overrides refine preset.
# Env: CAMSIM_SENSOR_QUALITY_PRESET (and per-field env vars)
sensor_quality:
  preset: medium
  noise_scale: 1.0
  vignetting_scale: 1.0
  scan_line_scale: 1.0
  atmosphere_scale: 1.0
  blur_radius: 0
  contrast: 1.0
  brightness_bias: 0.0

# --- Output Views (multi-stream) ---
# Optional fan-out of the captured frame to multiple MPEG-TS outputs.
# Empty/omitted = single stream using root multicast_*/video settings.
# hfov_deg: 0 = use live HFOV; nonzero = digital zoom center crop.
# When CAMSIM_MULTICAST_ADDR/PORT env vars are set, they override all
# per-view routes (useful for local unicast testing).
output_views:
  - view_id: 0
    enabled: true
    multicast_addr: "239.1.1.1"
    multicast_port: 5004
    video_bitrate: 4000000
    h264_preset: ultrafast
    h264_tune: zerolatency
    hfov_deg: 0.0

# --- Ground Truth Sidecar ---
# Per-frame JSONL output (pose, gimbal, LOS, sensor state) for analytics.
# Env: CAMSIM_GROUND_TRUTH_ENABLED, CAMSIM_GROUND_TRUTH_PATH,
#      CAMSIM_GROUND_TRUTH_INTERVAL_FRAMES
ground_truth:
  enabled: false
  output_path: camsim_groundtruth.jsonl
  interval_frames: 1

# --- ML Training Data (Phase 17) ---
# Enable structured training data output: COCO/VOC bounding boxes + 16-bit depth PNGs.
# Env: CAMSIM_ML_ENABLED, CAMSIM_ML_OUTPUT_DIR
ml_training:
  # Master enable; all other settings are ignored when false.
  # Env: CAMSIM_ML_ENABLED
  enabled: false

  # Output root directory. Relative paths are anchored to the process base dir.
  # Subdirectories created automatically: depth/, annotations/ (VOC only).
  # Env: CAMSIM_ML_OUTPUT_DIR
  output_dir: ml_output

  # Write 16-bit grayscale depth PNG per frame (SCS_SceneDepth, cm → 16-bit quantized).
  # Env: CAMSIM_ML_DEPTH_ENABLED
  depth_map: true

  # Write per-frame entity bounding box annotations.
  # Env: CAMSIM_ML_BBOX_ENABLED
  bounding_boxes: true

  # COCO JSONL format (one JSON object per frame, streamable).
  # Env: CAMSIM_ML_COCO_ENABLED
  coco_export: true

  # Pascal VOC XML format (one XML file per frame in annotations/).
  # Env: CAMSIM_ML_VOC_ENABLED
  voc_export: false

  # Write annotations every N frames (1 = every frame, 30 = 1 Hz at 30fps).
  # Env: CAMSIM_ML_INTERVAL_FRAMES
  annotation_interval_frames: 1

  # Far plane for depth quantization (0 m → 0, far_plane_m → 65535).
  # Env: CAMSIM_ML_DEPTH_FAR_PLANE_M
  depth_far_plane_m: 5000.0

# --- Entity Scale ---
# Runtime controls for large-scene scaling (LOD/culling/throttle).
# Env: CAMSIM_MAX_ENTITIES, CAMSIM_ENTITY_MAX_DRAW_DISTANCE_M,
#      CAMSIM_ENTITY_TICK_RATE_HZ, CAMSIM_ENTITY_DEFAULT_MAX_UPDATE_RATE_HZ

# Maximum simultaneous entities. Env: CAMSIM_MAX_ENTITIES
max_entities: 500

# Use instanced rendering for entities with the same mesh type.
use_instanced_rendering: true

# Use GPU post-process materials for sensor effects instead of CPU
# pipeline. Set false for Mesa llvmpipe compatibility.
gpu_sensor_effects: false

entity_scale:
  # Draw/cull distance in metres. 0 = no distance culling.
  max_draw_distance_m: 0.0
  # Entity actor tick rate in Hz. 0 = every frame.
  tick_rate_hz: 0.0
  # Global cap for pose-apply rate (reduces transform churn). 0 = uncapped.
  default_max_update_rate_hz: 0.0
  # Per-entity overrides keyed by EntityId string.
  max_update_rate_hz_overrides:
    "1": 30.0

# --- Scenario Orchestration ---
# Deterministic entity spawn/update/despawn without an external CIGI host.
# Useful for repeatable scenario authoring and CI smoke tests.
# Env: CAMSIM_SCENARIO_ENABLED, CAMSIM_SCENARIO_TIME_SCALE
scenario:
  enabled: false
  # Time multiplier. 2.0 = double speed.
  time_scale: 1.0
  entities:
    - entity_id: 2001
      entity_type: 1001
      start_latitude: 38.8977
      start_longitude: -77.0365
      start_altitude: 900.0
      start_yaw: 90.0
      start_pitch: 0.0
      start_roll: 0.0
      # Spawn/despawn times in scenario seconds. despawn <= spawn = persist.
      spawn_time_sec: 0.0
      despawn_time_sec: 0.0
      # Scripted pose update rate. 0 = every manager tick.
      update_rate_hz: 10.0
      # Scripted trajectory rates (north/east/up m/s, yaw/pitch/roll deg/s).
      north_rate_mps: 50.0
      east_rate_mps: 0.0
      up_rate_mps: 0.0
      yaw_rate_dps: 0.0
      pitch_rate_dps: 0.0
      roll_rate_dps: 0.0

# --- Sensor Modes (per-waveband) ---
# CPU-side post-processing parameters. SensorId 0=EO, 1=IR, 2=NVG.
# See docs/configuration.md for the full field reference table.
sensor_modes:
  eo:
    noise_netd: 0.0
    fixed_pattern_noise: 0.0
    vignetting: 0.10
    scan_lines: false
    scan_line_strength: 0.0
    ir_extinction_coeff: 0.0
    atmospheric_visibility_m: 0.0
    atmosphere_strength: 1.0
    color_temperature_k: 6500.0
    contrast: 1.0
    brightness_bias: 0.0
    blur_radius: 0
    # Phase 16 (disabled for EO)
    agc_enabled: false
    defect_pixel_count: 0
    gaussian_sigma: 0.0
    # 16H — Rolling shutter (EO only)
    rolling_shutter_strength: 0.0  # 0 = global shutter; 0.5 = moderate; 1.0 = full
    # 16I — Platform vibration (all modes)
    vibration_amplitude: 0.0       # pixels, 0 = disabled
    # 16K — Sun glint (EO only)
    sun_glint_intensity: 0.0       # 0 = disabled
    sun_glint_threshold: 220.0
    sun_glint_spread: 2.0
  ir:
    noise_netd: 0.01
    fixed_pattern_noise: 0.005
    vignetting: 0.20
    scan_lines: false
    scan_line_strength: 0.0
    ir_extinction_coeff: 0.00001
    atmospheric_visibility_m: 12000.0
    atmosphere_strength: 0.75
    color_temperature_k: 0.0
    contrast: 1.1
    brightness_bias: -0.03
    blur_radius: 0
    # 16A — Radiance-based AGC
    agc_enabled: true
    agc_low_percentile: 0.01
    agc_high_percentile: 0.99
    agc_manual_level: -1.0      # -1 = AGC mode; >=0 disables AGC
    agc_manual_gain: 1.0
    # 16B — Quantization
    quantization_bits: 8        # 8 = no effect; 4-7 = visible quantization
    quantization_dither: false
    # 16C — Hot/dead pixels
    defect_pixel_count: 150
    defect_hot_ratio: 0.6
    defect_seed: 42
    # 16D — MTF Gaussian blur
    gaussian_sigma: 0.5         # 0 = disabled; 0.5 = mild; 1.5 = poor optics
    # 16F — AC banding
    ac_banding_amplitude: 4.0   # DN, subtle artifact
    ac_banding_frequency: 3.0   # cycles per frame height
    # 16E — Thermal drift (IR only)
    thermal_drift_enabled: true
    thermal_drift_rate: 0.5     # DN/sec
    nuc_interval_sec: 30.0      # auto-NUC reset interval (0 = no auto-NUC)
    # 16G — AGC lag (IR/NVG)
    agc_lag_frames: 2           # frames for AGC convergence (0 = instant)
    # 16I — Platform vibration
    vibration_amplitude: 0.0    # pixels, 0 = disabled
    # 16J — Sensor gain/offset noise (IR only)
    gain_jitter: 0.005          # fractional gain variation per frame
    offset_jitter: 1.0          # DN offset variation per frame
  nvg:
    noise_netd: 0.03
    fixed_pattern_noise: 0.0
    vignetting: 0.35
    scan_lines: false
    scan_line_strength: 0.05
    ir_extinction_coeff: 0.0
    atmospheric_visibility_m: 8000.0
    atmosphere_strength: 0.9
    color_temperature_k: 5200.0
    contrast: 1.2
    brightness_bias: 0.02
    blur_radius: 0
    # 16A — AGC for NVG
    agc_enabled: true
    agc_low_percentile: 0.02
    agc_high_percentile: 0.98
    # 16G — AGC lag (NVG)
    agc_lag_frames: 1
    # 16L — NVG IR pointer
    ir_pointer_enabled: false
    ir_pointer_x: 0.5
    ir_pointer_y: 0.5
    ir_pointer_radius: 8.0
    ir_pointer_intensity: 240.0

# --- Optical Realism (Phase 15) ---
# GPU-side + CPU-side optical effects for camera realism.
# Master toggle: enabled=false gives clean ML training frames.
optical_realism:
  enabled: false
  # 15A Motion Blur (GPU)
  motion_blur: true
  motion_blur_amount: 0.5
  motion_blur_max: 5
  # 15B Lens Distortion (CPU, Brown-Conrady radial model)
  lens_distortion: false
  distortion_k1: 0.0
  distortion_k2: 0.0
  # 15C Bloom (GPU)
  bloom: true
  bloom_intensity: 0.675
  bloom_threshold: -1.0
  # 15D Chromatic Aberration (GPU)
  chromatic_aberration: false
  chromatic_aberration_intensity: 0.0
  # 15E Depth of Field (GPU). focal_distance 0 = auto-focus from LOS range.
  depth_of_field: false
  focal_distance: 0.0
  aperture_fstop: 4.0
  sensor_width: 24.576
  # 15F Lens Flare (GPU)
  lens_flare: false
  lens_flare_intensity: 1.0
  lens_flare_bokeh_size: 3.0
  lens_flare_threshold: 8.0

# --- Weather, Atmosphere & Particle Effects (Phase 18) ---
# All effects default to false (opt-in). Safe to leave disabled for clean ML frames.
phase18:
  # 18C Second fog layer (low-lying ground mist via UE ExponentialHeightFog SecondFogData)
  second_fog: false
  fog_density: 0.02
  fog_height_falloff: 0.2
  # 18D CPU precipitation overlay (rain/snow pixel pass on task thread)
  precipitation: false
  rain_intensity: 0.0        # [0,1] drop density
  snow_intensity: 0.0        # [0,1] flake density
  # 18E God rays / light shafts (UE DirectionalLight bloom + occlusion)
  god_rays: false
  god_ray_intensity: 1.0
  # 18J Atmospheric scattering overrides (USkyAtmosphereComponent multipliers)
  atmospheric_scattering: false
  rayleigh_scattering: 1.0   # multiplier on Rayleigh coefficient
  mie_scattering: 1.0        # multiplier on Mie coefficient
  # 18K Dynamic IR extinction driven by atmospheric visibility range
  dynamic_ir_extinction: false
  visibility_range_m: 10000.0

  # 18A/18B Volumetric cloud shadow (cloud actor must exist in the level)
  volumetric_clouds: false
  cloud_shadow_strength: 0.6   # [0,1] intensity of cloud shadow projected onto terrain

  # 18L Regional weather zones — CIGI RegionId > 0 updates zone parameters
  weather_zones: false
  zone_positions:              # static lat/lon positions; parameters updated by CIGI
    - { id: 1, lat: 37.0, lon: -122.0, radius_m: 10000.0 }
    # add more zones here (max 16)

  # 18F/18G/18H Niagara particle FX — asset paths authored in UE editor
  niagara_rotor_wash: "/Game/Effects/NS_RotorWash"
  niagara_smoke:      "/Game/Effects/NS_Smoke"
  niagara_fire:       "/Game/Effects/NS_Fire"
  niagara_contrail:   "/Game/Effects/NS_Contrail"
  contrail_alt_m: 8000.0    # metres — altitude above which contrails form
  contrail_speed_ms: 100.0  # reserved for future use (speed data not in CIGI entity state)
  smoke_component_id: 1     # CIGI Component Control CompId -> smoke
  fire_component_id: 2      # CIGI Component Control CompId -> fire

  # 18I Decal cratering
  crater_decal_material: "/Game/Effects/M_Crater"
  crater_impact_component_id: 10
  max_craters: 32
  crater_default_radius_m: 5.0

# --- Security Metadata (MISB ST 0102) ---
# Embedded in every KLV packet as ST 0601 Tag 48.
# Required for STANAG 4609 compliance even for unclassified output.
# Env: CAMSIM_SECURITY_CLASSIFICATION, CAMSIM_SECURITY_CLASSIFYING_COUNTRY,
#      CAMSIM_SECURITY_OBJECT_COUNTRY
security_metadata:
  classification: "UNCLASSIFIED"
  classifying_country: "//US"
  object_country_codes: "US"
  caveats: ""
  releasing_instructions: ""

# --- Prometheus Metrics ---
# Path to write Prometheus node_exporter textfile-collector compatible metrics.
# Empty = disabled.
# Env: CAMSIM_PROMETHEUS_METRICS_PATH
prometheus_metrics_path: ""

# --- Recording & Playback ---
# Record CIGI input and/or video output for offline analysis and replay.
# Env: CAMSIM_CIGI_RECORD_PATH, CAMSIM_VIDEO_RECORD_PATH, CAMSIM_CIGI_PLAYBACK_PATH
recording:
  # Binary file: raw CIGI UDP datagrams with timestamps for deterministic replay.
  cigi_record_path: ""
  # Local MPEG-TS file: H.264/H.265 video + KLV metadata mirror of the UDP stream.
  video_record_path: ""
  # When set, CigiReceiver reads from this file instead of UDP socket (playback mode).
  cigi_playback_path: ""

# --- Entity Types ---
# Maps CIGI EntityType uint16 to asset paths.
# Use .gltf/.glb paths (relative to entities/) for runtime loading,
# or /Game/... UE content paths for cooked assets.
# "scale": uniform scale factor (default 1.0).
# "rotation": pitch/yaw/roll offset in degrees to correct model-space orientation.
entity_types:
  "1001":
    mesh: f16/f16-c_falcon.glb
    skeletal: false
    scale: 1.0
    rotation:
      pitch: 0.0
      yaw: 0.0
      roll: 0.0
