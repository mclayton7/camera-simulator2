# CamSim Configuration
# All values can be overridden via environment variables (noted per field).

# --- CIGI 3.3 Input (Host -> IG) ---

# Local address to bind the CIGI UDP socket. "0.0.0.0" = all interfaces.
# Env: CAMSIM_CIGI_BIND_ADDR
cigi_bind_addr: "0.0.0.0"

# UDP port for incoming CIGI 3.3 packets from the host simulation.
# Env: CAMSIM_CIGI_PORT
cigi_port: 8888

# --- CIGI 3.3 Response (IG -> Host) ---

# Destination IP for IG -> Host packets (SOF heartbeat, HAT/HOT, LOS).
# Set to the host simulation's IP address.
# Env: CAMSIM_CIGI_RESPONSE_ADDR
cigi_response_addr: "127.0.0.1"

# Destination UDP port for IG -> Host packets.
# Env: CAMSIM_CIGI_RESPONSE_PORT
cigi_response_port: 8889

# --- DIS Protocol (IEEE 1278.1) ---
# Alternative/supplemental entity input via DIS protocol.
# When enabled, FDisReceiver runs alongside FCigiReceiver (both can coexist).
# DIS entities are translated to CamSim's internal format automatically.

# Master toggle: enable DIS receiver thread.
# Env: CAMSIM_DIS_ENABLED
dis:
  enabled: false

  # UDP bind address for incoming DIS PDUs.
  # Env: CAMSIM_DIS_BIND_ADDR
  bind_addr: "0.0.0.0"

  # UDP port for DIS traffic (IEEE 1278.1 default is 3000).
  # Env: CAMSIM_DIS_PORT
  port: 3000

  # Multicast group to join (empty = no multicast, receive unicast only).
  # Env: CAMSIM_DIS_MULTICAST_GROUP
  multicast_group: "239.1.2.3"

  # DIS exercise ID filter. Only PDUs with this exercise ID are accepted.
  # Set to 0 to accept all exercises.
  # Env: CAMSIM_DIS_EXERCISE_ID
  exercise_id: 1

  # This IG's DIS site and application identifiers.
  # Env: CAMSIM_DIS_SITE_ID, CAMSIM_DIS_APP_ID
  site_id: 1
  application_id: 1

  # Entity heartbeat timeout in seconds. DIS has no explicit "remove entity"
  # packet — entities are removed when no Entity State PDU arrives within
  # this interval.
  # Env: CAMSIM_DIS_HEARTBEAT_TIMEOUT
  heartbeat_timeout_sec: 12.0

  # CamSim entity ID range start for DIS entities. IDs 0-999 are reserved
  # for CIGI entities; DIS entities get IDs starting at this offset.
  # Env: CAMSIM_DIS_ID_BASE_OFFSET
  id_base_offset: 1000

  # Default CamSim entity type ID for unmapped DIS entity types.
  # Env: CAMSIM_DIS_DEFAULT_ENTITY_TYPE
  default_entity_type_id: 1001

  # DIS entity type → CamSim entity type mapping table.
  # Keys are "kind:domain:country:category:subcategory:specific:extra" strings.
  # Values are CamSim entity type IDs (matching entity_types keys below).
  # Unmapped types fall back through fuzzy match (kind:domain:category)
  # then to default_entity_type_id.
  # entity_type_map:
  #   "1:2:225:1:2:0:0": 1001   # F-16 -> type 1001
  #   "1:1:225:1:0:0:0": 1002   # M1 Abrams -> type 1002

# --- Streaming & ATAK Interop (Phase 21 Sprint 2) ---
# CoT (Cursor on Target) position reporting and ATAK FMV streaming.
# ROVER compatibility changes MPEG-TS PID assignments for ROVER terminals.

streaming:
  # CoT position sender (XML-over-UDP multicast)
  # Env: CAMSIM_COT_ENABLED
  cot_enabled: false
  cot_addr: "239.2.3.1"       # CAMSIM_COT_ADDR
  cot_port: 6969               # CAMSIM_COT_PORT
  cot_interval_sec: 2.0        # CAMSIM_COT_INTERVAL
  cot_uid: "CamSim-ISR-1"     # CAMSIM_COT_UID
  cot_type: "a-f-G-E-S"       # CAMSIM_COT_TYPE
  cot_callsign: "CAMSIM"       # CAMSIM_COT_CALLSIGN

  # ATAK FMV second output view (UDP MPEG-TS, Baseline profile)
  # Env: CAMSIM_ATAK_VIEW_ENABLED
  atak_view_enabled: false
  atak_addr: "239.1.1.2"      # CAMSIM_ATAK_ADDR
  atak_port: 5005              # CAMSIM_ATAK_PORT
  atak_bitrate: 2000000        # CAMSIM_ATAK_BITRATE

  # ROVER terminal compatibility (changes MPEG-TS PIDs)
  # Env: CAMSIM_ROVER_COMPAT
  rover_compat: false
  rover_video_pid: 0x1011      # CAMSIM_ROVER_VIDEO_PID (decimal: 4113)
  rover_klv_pid: 0x1012        # CAMSIM_ROVER_KLV_PID   (decimal: 4114)

# --- Laser Designator (Phase 21 Sprint 2) ---
# Renders a Gaussian laser spot on the sensor output.
# When DIS Designator PDUs are received, spot position is updated dynamically.

laser_designator:
  # Env: CAMSIM_LASER_ENABLED
  enabled: false
  spot_x: 0.5                  # CAMSIM_LASER_X (normalized 0-1)
  spot_y: 0.5                  # CAMSIM_LASER_Y (normalized 0-1)
  spot_radius: 6.0             # CAMSIM_LASER_RADIUS (pixels, 1-sigma)
  spot_intensity: 250.0        # CAMSIM_LASER_INTENSITY (0-255)
  designator_code: 1688        # CAMSIM_LASER_CODE (NATO laser code)

# --- Video Output ---

# UDP multicast group (or unicast address) for the MPEG-TS output stream.
# For local testing use "127.0.0.1"; macOS multicast needs a route
# (see scripts/README or MEMORY.md for the sudo route add command).
# Env: CAMSIM_MULTICAST_ADDR
multicast_addr: "239.1.1.1"

# Destination UDP port for the MPEG-TS stream.
# Env: CAMSIM_MULTICAST_PORT
multicast_port: 5004

# Target H.264 bitrate in bits/sec. 4 Mbps suits 1080p/30fps ultrafast.
# Env: CAMSIM_VIDEO_BITRATE
video_bitrate: 4000000

# libx264 encoding preset. Slower presets (fast, medium) give better
# quality at higher CPU cost. Ignored when using NVENC.
# Env: CAMSIM_H264_PRESET
h264_preset: ultrafast

# libx264 tune parameter. "zerolatency" minimises encode latency.
h264_tune: zerolatency

# --- Capture & Readback ---

# Render target dimensions in pixels.
capture_width: 1280
capture_height: 720

# Fixed tick rate. Must match DefaultEngine.ini FixedFrameRate setting.
frame_rate: 30.0

# Force a red/blue channel swap on GPU readback. Enable if the platform
# reports BGRA but delivers RGBA (rare).
# Env: CAMSIM_SWAP_RB_READBACK (0 or 1)
swap_rb_readback: false

# Consecutive FRHIGPUTextureReadback::IsReady() polls required before
# Lock(). Increase on Linux/Vulkan if occasional partial-row tearing.
# Env: CAMSIM_READBACK_READY_POLLS
readback_ready_polls: 1

# Override readback byte order: auto, bgra, rgba, argb, abgr.
# "auto" uses the render target's native format.
# Env: CAMSIM_READBACK_FORMAT
readback_format: auto

# Horizontal field of view in degrees. Used for KLV metadata and Cesium
# tile preloading. Overridden per-frame by CIGI View Definition packets.
hfov_deg: 60.0

# --- Encoder ---

# Video codec: "h264" (default) or "h265" (STANAG 4609 Ed4).
# Env: CAMSIM_VIDEO_CODEC
video_codec: h264

# KLV checksum algorithm.
# "crc16" = CRC-16/CCITT (default, matches validate_klv.py)
# "bcc16" = BCC-16 running sum (per MISB ST 0601 specification)
# Env: CAMSIM_KLV_CHECKSUM_MODE
klv_checksum_mode: "crc16"

# Encoder implementation: "auto" tries NVENC first, falls back to
# libx264/libx265. Explicit values: "nvenc", "libx264", "libx265".
# Env: CAMSIM_ENCODER
encoder: auto

# Encoder watchdog action when no frames are written for
# encoder_watchdog_interval_ticks: reconnect, log_only, fail_fast.
# Env: CAMSIM_ENCODER_WATCHDOG_POLICY
encoder_watchdog_policy: reconnect

# Tick interval for encoder watchdog and runtime health checks.
# Env: CAMSIM_ENCODER_WATCHDOG_INTERVAL_TICKS
encoder_watchdog_interval_ticks: 150

# Maximum encoder reconnect attempts before RequestExit (0 = unlimited).
watchdog_max_reconnects: 3

# --- Geospatial (Cesium) ---

# Terrain/imagery provider selector. Currently supported: "cesium".
# Env: CAMSIM_TERRAIN_PROVIDER / CAMSIM_IMAGERY_PROVIDER
terrain_provider: cesium
imagery_provider: cesium

# Enable Cesium's per-frame tile selection logging (very verbose).
# Shows tiles visited, rendered, culled, queue lengths per frame.
# Env: CAMSIM_LOG_TILE_STATS
log_tile_stats: false

# Multiplier on hfov_deg reported to CesiumCameraManager prefetch camera.
# >1.0 pre-fetches tiles outside the frustum to reduce pop-in on pan.
# Lower values free loading slots for visible tiles (1.5 = 50% extra).
# Env: CAMSIM_TILE_FOV_SCALE
tile_preload_fov_scale: 1.5

# Maximum concurrent Cesium tile HTTP requests. Higher = faster initial
# load at the cost of network/CPU. Keep ≤20 for real-time 30fps.
# Env: CAMSIM_MAX_TILE_LOADS
max_simultaneous_tile_loads: 20

# Cesium LOD quality: lower = sharper terrain. Cesium default is 16;
# for quantized-mesh terrain (CWT), value is internally divided by 8,
# so 8.0 → effective 1.0 px error (good balance of quality vs perf).
# Previous 2.0 caused 44K+ loaded tiles and ~18 fps on macOS.
# Env: CAMSIM_MAX_SSE
maximum_screen_space_error: 16.0

# Cesium tile cache budget in MB (per tileset). 0 = Cesium default (uncapped).
# Large cache avoids re-downloading tiles when revisiting areas.
# Env: CAMSIM_MAX_CACHED_MB
maximum_cached_bytes_mb: 1024

# Max descendant tiles to load simultaneously (Cesium default 20; higher = better low-alt detail).
# Env: CAMSIM_LOADING_DESCENDANT_LIMIT
loading_descendant_limit: 20

# Enable smooth opacity crossfade when tile LOD level changes (Cesium UseLodTransitions).
# Disabled: crossfade causes blur on moving cameras with SceneCapture2D.
# Env: CAMSIM_USE_LOD_TRANSITIONS
use_lod_transitions: false

# Duration of LOD crossfade in seconds (only used when use_lod_transitions=true).
# Env: CAMSIM_LOD_TRANSITION_LENGTH
lod_transition_length: 0.0

# --- Camera Start Position (WGS-84) ---
# Initial camera pose before the first CIGI Entity Control packet.

# Decimal degrees. Default: Yuma, AZ area.
# Env: CAMSIM_START_LAT / CAMSIM_START_LON
start_latitude: 32.97679168129847
start_longitude: -114.26653388625711

# Height above WGS-84 ellipsoid in metres.
# Env: CAMSIM_START_ALT
start_altitude: 1500.0

# Initial heading [0, 360) degrees.
# Env: CAMSIM_START_YAW
start_yaw: 200.0

# Initial pitch in degrees. Negative = looking down.
# Env: CAMSIM_START_PITCH
start_pitch: 0.0

# Initial roll in degrees.
# Env: CAMSIM_START_ROLL
start_roll: 0.0

# Time of day (0-24). Sets sun position before a CIGI Celestial Control.
# Env: CAMSIM_START_HOUR
start_hour: 12.0

# CIGI Entity ID that drives the camera. All other entity IDs are managed
# by the entity renderer. Must match --entity-id in send_cigi_test.py.
camera_entity_id: 0

# --- Gimbal ---

# Maximum gimbal slew rate in deg/s. 0 = unlimited (instant snap).
# Applies to both yaw and pitch axes.
gimbal_max_slew_rate: 0.0

# Physical axis limits in degrees. Applied after every slew update.
gimbal_pitch_min: -90.0
gimbal_pitch_max: 30.0
gimbal_yaw_min: -180.0
gimbal_yaw_max: 180.0

# --- Sensor FOV Presets ---
# Ordered wide->narrow FOV values (degrees). Sensor Control Gain (0.0=wide,
# 1.0=narrow) selects by index. Empty array = ignore Gain, use ViewDef FOV.
sensor_fov_presets:
  - 60.0
  - 20.0
  - 5.0

# --- Sensor Quality Profile ---
# Global quality profile applied on top of per-waveband sensor_modes.
# Preset: low|medium|high|ultra|custom. Numeric overrides refine preset.
# Env: CAMSIM_SENSOR_QUALITY_PRESET (and per-field env vars)
sensor_quality:
  preset: medium
  noise_scale: 1.0
  vignetting_scale: 1.0
  scan_line_scale: 1.0
  atmosphere_scale: 1.0
  blur_radius: 0
  contrast: 1.0
  brightness_bias: 0.0

# --- Output Views (multi-stream) ---
# Optional fan-out of the captured frame to multiple MPEG-TS outputs.
# Empty/omitted = single stream using root multicast_*/video settings.
# hfov_deg: 0 = use live HFOV; nonzero = digital zoom center crop.
# When CAMSIM_MULTICAST_ADDR/PORT env vars are set, they override all
# per-view routes (useful for local unicast testing).
output_views:
  - view_id: 0
    enabled: true
    multicast_addr: "239.1.1.1"
    multicast_port: 5004
    video_bitrate: 4000000
    h264_preset: ultrafast
    h264_tune: zerolatency
    hfov_deg: 0.0

# --- Ground Truth Sidecar ---
# Per-frame JSONL output (pose, gimbal, LOS, sensor state) for analytics.
# Env: CAMSIM_GROUND_TRUTH_ENABLED, CAMSIM_GROUND_TRUTH_PATH,
#      CAMSIM_GROUND_TRUTH_INTERVAL_FRAMES
ground_truth:
  enabled: false
  output_path: camsim_groundtruth.jsonl
  interval_frames: 1

# --- ML Training Data (Phase 17) ---
# Enable structured training data output: COCO/VOC bounding boxes + 16-bit depth PNGs.
# Env: CAMSIM_ML_ENABLED, CAMSIM_ML_OUTPUT_DIR
ml_training:
  # Master enable; all other settings are ignored when false.
  # Env: CAMSIM_ML_ENABLED
  enabled: false

  # Output root directory. Relative paths are anchored to the process base dir.
  # Subdirectories created automatically: depth/, annotations/ (VOC only).
  # Env: CAMSIM_ML_OUTPUT_DIR
  output_dir: ml_output

  # Write 16-bit grayscale depth PNG per frame (SCS_SceneDepth, cm → 16-bit quantized).
  # Env: CAMSIM_ML_DEPTH_ENABLED
  depth_map: true

  # Write per-frame entity bounding box annotations.
  # Env: CAMSIM_ML_BBOX_ENABLED
  bounding_boxes: true

  # COCO JSONL format (one JSON object per frame, streamable).
  # Env: CAMSIM_ML_COCO_ENABLED
  coco_export: true

  # Pascal VOC XML format (one XML file per frame in annotations/).
  # Env: CAMSIM_ML_VOC_ENABLED
  voc_export: false

  # Write annotations every N frames (1 = every frame, 30 = 1 Hz at 30fps).
  # Env: CAMSIM_ML_INTERVAL_FRAMES
  annotation_interval_frames: 1

  # Far plane for depth quantization (0 m → 0, far_plane_m → 65535).
  # Env: CAMSIM_ML_DEPTH_FAR_PLANE_M
  depth_far_plane_m: 5000.0

# --- Entity Scale ---
# Runtime controls for large-scene scaling (LOD/culling/throttle).
# Env: CAMSIM_MAX_ENTITIES, CAMSIM_ENTITY_MAX_DRAW_DISTANCE_M,
#      CAMSIM_ENTITY_TICK_RATE_HZ, CAMSIM_ENTITY_DEFAULT_MAX_UPDATE_RATE_HZ

# Maximum simultaneous entities. Env: CAMSIM_MAX_ENTITIES
max_entities: 500

# Use instanced rendering for entities with the same mesh type.
use_instanced_rendering: true


entity_scale:
  # Draw/cull distance in metres. 0 = no distance culling.
  max_draw_distance_m: 0.0
  # Entity actor tick rate in Hz. 0 = every frame.
  tick_rate_hz: 0.0
  # Global cap for pose-apply rate (reduces transform churn). 0 = uncapped.
  default_max_update_rate_hz: 0.0
  # Per-entity overrides keyed by EntityId string.
  max_update_rate_hz_overrides:
    "1": 30.0

# --- Scenario Orchestration ---
# Deterministic entity spawn/update/despawn without an external CIGI host.
# Useful for repeatable scenario authoring and CI smoke tests.
# Env: CAMSIM_SCENARIO_ENABLED, CAMSIM_SCENARIO_TIME_SCALE
scenario:
  enabled: false
  # Time multiplier. 2.0 = double speed.
  time_scale: 1.0
  entities:
    - entity_id: 2001
      entity_type: 1001
      start_latitude: 38.8977
      start_longitude: -77.0365
      start_altitude: 900.0
      start_yaw: 90.0
      start_pitch: 0.0
      start_roll: 0.0
      # Spawn/despawn times in scenario seconds. despawn <= spawn = persist.
      spawn_time_sec: 0.0
      despawn_time_sec: 0.0
      # Scripted pose update rate. 0 = every manager tick.
      update_rate_hz: 10.0
      # Scripted trajectory rates (north/east/up m/s, yaw/pitch/roll deg/s).
      # Used when no waypoints are defined (linear rate fallback).
      north_rate_mps: 50.0
      east_rate_mps: 0.0
      up_rate_mps: 0.0
      yaw_rate_dps: 0.0
      pitch_rate_dps: 0.0
      roll_rate_dps: 0.0
      # Phase 23A — Waypoint trajectory (overrides linear rates when present).
      # base_speed_mps: default speed between waypoints (m/s).
      # loop_waypoints: true = loop back to first waypoint after last.
      base_speed_mps: 50.0
      loop_waypoints: false
      waypoints: []
      #   - lat: 38.8977
      #     lon: -77.0365
      #     alt: 900.0
      #     speed_mps: 0.0        # 0 = use base_speed_mps
      #     heading_deg: -1.0     # -1 = auto from great-circle bearing
      #     pause_sec: 0.0        # dwell at waypoint before continuing
      #   - lat: 38.9100
      #     lon: -77.0200
      #     alt: 900.0
      #     speed_mps: 60.0
      #     heading_deg: -1.0
      #     pause_sec: 5.0
      # Phase 23C — Pattern-of-life schedule (keyed by time-of-day).
      activity_profile: ""       # "civilian" | "military" | "" (custom)
      activity_schedule: []
      #   - start_hour: 6.0
      #     end_hour: 12.0
      #     waypoint_path: 0
      #     spawn_jitter_sec: 0.0
      #     path_deviation_m: 0.0
  # Phase 23C — Scenario time-of-day start hour (0-24).
  # Env: CAMSIM_SCENARIO_START_HOUR
  start_hour: 6.0
  # Phase 23B — Event triggers (condition → action).
  # Env: none (YAML only).
  triggers: []
  #   - name: "spawn_target_at_30s"
  #     condition:
  #       type: time_sec
  #       time_sec: 30.0
  #     action:
  #       type: spawn_entity
  #       target_entity_id: 2002
  #       target_entity_type: 1001
  #       spawn_latitude: 38.9050
  #       spawn_longitude: -77.0300
  #       spawn_altitude: 0.0
  #     repeat: false
  #     cooldown_sec: 0.0
  #   - name: "despawn_on_proximity"
  #     condition:
  #       type: entity_proximity
  #       entity_id_a: 2001
  #       entity_id_b: 2002
  #       radius_m: 50.0
  #     action:
  #       type: despawn_entity
  #       target_entity_id: 2002
  #     repeat: false
  #     cooldown_sec: 0.0

# --- Sensor Modes (per-waveband) ---
# CPU-side post-processing parameters. SensorId 0=EO, 1=IR, 2=NVG.
# See docs/configuration.md for the full field reference table.
sensor_modes:
  eo:
    noise_netd: 0.0
    fixed_pattern_noise: 0.0
    vignetting: 0.10
    scan_lines: false
    scan_line_strength: 0.0
    ir_extinction_coeff: 0.0
    atmospheric_visibility_m: 0.0
    atmosphere_strength: 1.0
    color_temperature_k: 6500.0
    contrast: 1.0
    brightness_bias: 0.0
    blur_radius: 0
    # Phase 16 (disabled for EO)
    agc_enabled: false
    defect_pixel_count: 0
    gaussian_sigma: 0.0
    # 16H — Rolling shutter (EO only)
    rolling_shutter_strength: 0.0  # 0 = global shutter; 0.5 = moderate; 1.0 = full
    # 16I — Platform vibration (all modes)
    vibration_amplitude: 0.0       # pixels, 0 = disabled
    # 16K — Sun glint (EO only)
    sun_glint_intensity: 0.0       # 0 = disabled
    sun_glint_threshold: 220.0
    sun_glint_spread: 2.0
  ir:
    noise_netd: 0.01
    fixed_pattern_noise: 0.005
    vignetting: 0.20
    scan_lines: false
    scan_line_strength: 0.0
    ir_extinction_coeff: 0.00001
    atmospheric_visibility_m: 12000.0
    atmosphere_strength: 0.75
    color_temperature_k: 0.0
    contrast: 1.1
    brightness_bias: -0.03
    blur_radius: 0
    # 16A — Radiance-based AGC
    agc_enabled: true
    agc_low_percentile: 0.01
    agc_high_percentile: 0.99
    agc_manual_level: -1.0      # -1 = AGC mode; >=0 disables AGC
    agc_manual_gain: 1.0
    # 16B — Quantization
    quantization_bits: 8        # 8 = no effect; 4-7 = visible quantization
    quantization_dither: false
    # 16C — Hot/dead pixels
    defect_pixel_count: 150
    defect_hot_ratio: 0.6
    defect_seed: 42
    # 16D — MTF Gaussian blur
    gaussian_sigma: 0.5         # 0 = disabled; 0.5 = mild; 1.5 = poor optics
    # 16F — AC banding
    ac_banding_amplitude: 4.0   # DN, subtle artifact
    ac_banding_frequency: 3.0   # cycles per frame height
    # 16E — Thermal drift (IR only)
    thermal_drift_enabled: true
    thermal_drift_rate: 0.5     # DN/sec
    nuc_interval_sec: 30.0      # auto-NUC reset interval (0 = no auto-NUC)
    # 16G — AGC lag (IR/NVG)
    agc_lag_frames: 2           # frames for AGC convergence (0 = instant)
    # 16I — Platform vibration
    vibration_amplitude: 0.0    # pixels, 0 = disabled
    # 16J — Sensor gain/offset noise (IR only)
    gain_jitter: 0.005          # fractional gain variation per frame
    offset_jitter: 1.0          # DN offset variation per frame
  nvg:
    noise_netd: 0.03
    fixed_pattern_noise: 0.0
    vignetting: 0.35
    scan_lines: false
    scan_line_strength: 0.05
    ir_extinction_coeff: 0.0
    atmospheric_visibility_m: 8000.0
    atmosphere_strength: 0.9
    color_temperature_k: 5200.0
    contrast: 1.2
    brightness_bias: 0.02
    blur_radius: 0
    # 16A — AGC for NVG
    agc_enabled: true
    agc_low_percentile: 0.02
    agc_high_percentile: 0.98
    # 16G — AGC lag (NVG)
    agc_lag_frames: 1
    # 16L — NVG IR pointer
    ir_pointer_enabled: false
    ir_pointer_x: 0.5
    ir_pointer_y: 0.5
    ir_pointer_radius: 8.0
    ir_pointer_intensity: 240.0

# --- Optical Realism (Phase 15) ---
# GPU-side + CPU-side optical effects for camera realism.
# Master toggle: enabled=false gives clean ML training frames.
optical_realism:
  enabled: false
  # 15A Motion Blur (GPU)
  motion_blur: true
  motion_blur_amount: 0.5
  motion_blur_max: 5
  # 15B Lens Distortion (CPU, Brown-Conrady radial model)
  lens_distortion: false
  distortion_k1: 0.0
  distortion_k2: 0.0
  # 15C Bloom (GPU)
  bloom: true
  bloom_intensity: 0.675
  bloom_threshold: -1.0
  # 15D Chromatic Aberration (GPU)
  chromatic_aberration: false
  chromatic_aberration_intensity: 0.0
  # 15E Depth of Field (GPU). focal_distance 0 = auto-focus from LOS range.
  depth_of_field: false
  focal_distance: 0.0
  aperture_fstop: 4.0
  sensor_width: 24.576
  # 15F Lens Flare (GPU)
  lens_flare: false
  lens_flare_intensity: 1.0
  lens_flare_bokeh_size: 3.0
  lens_flare_threshold: 8.0

# --- Rendering Quality (Phase 24) ---

rendering_quality:
  # 24A: Entity shadow casting and contact shadows
  # Env: CAMSIM_ENTITY_SHADOWS / CAMSIM_CONTACT_SHADOWS / CAMSIM_CONTACT_SHADOW_LENGTH
  entity_shadows: true
  contact_shadows: false
  contact_shadow_length: 0.1

  # 24B: Ambient occlusion (Lumen GTAO) intensity and world-space radius
  # Env: CAMSIM_AO_INTENSITY / CAMSIM_AO_RADIUS
  ao_intensity: 0.0
  ao_radius: 200.0

  # Ray tracing backend (BLAS/TLAS allocation). Off by default for performance.
  # Enable on NVIDIA builds that want RT features. Requires project restart.
  # Env: CAMSIM_RT_ENABLED
  rt_enabled: false

  # 24D: Enable ray-traced reflections on SceneCapture (requires rt_enabled + NVIDIA GPU + DX12)
  # Env: CAMSIM_RT_REFLECTIONS
  rt_reflections: false

  # 24E: Shadow distance and Virtual Shadow Map quality
  # Env: CAMSIM_SHADOW_DISTANCE_SCALE / CAMSIM_VSM_RESOLUTION_BIAS / CAMSIM_VSM_MAX_PAGES
  shadow_distance_scale: 1.0
  vsm_resolution_bias: 0
  vsm_max_physical_pages: 2048

  # 24F: TSR screen percentage (100=native, >100=super-sample for crisp entity edges)
  # Env: CAMSIM_TSR_SCREEN_PERCENTAGE
  tsr_screen_percentage: 100

# --- Weather, Atmosphere & Particle Effects (Phase 18) ---
# All effects default to false (opt-in). Safe to leave disabled for clean ML frames.
phase18:
  # 18C Second fog layer (low-lying ground mist via UE ExponentialHeightFog SecondFogData)
  second_fog: false
  fog_density: 0.02
  fog_height_falloff: 0.2
  # 18D CPU precipitation overlay (rain/snow pixel pass on task thread)
  precipitation: false
  rain_intensity: 0.0        # [0,1] drop density
  snow_intensity: 0.0        # [0,1] flake density
  # 18E God rays / light shafts (UE DirectionalLight bloom + occlusion)
  god_rays: false
  god_ray_intensity: 1.0
  # 18J Atmospheric scattering overrides (USkyAtmosphereComponent multipliers)
  atmospheric_scattering: false
  rayleigh_scattering: 1.0   # multiplier on Rayleigh coefficient
  mie_scattering: 1.0        # multiplier on Mie coefficient
  # 18K Dynamic IR extinction driven by atmospheric visibility range
  dynamic_ir_extinction: false
  visibility_range_m: 10000.0

  # 18A/18B Volumetric cloud shadow (cloud actor must exist in the level)
  volumetric_clouds: false
  cloud_shadow_strength: 0.6   # [0,1] intensity of cloud shadow projected onto terrain

  # 18L Regional weather zones — CIGI RegionId > 0 updates zone parameters
  weather_zones: false
  zone_positions:              # static lat/lon positions; parameters updated by CIGI
    - { id: 1, lat: 37.0, lon: -122.0, radius_m: 10000.0 }
    # add more zones here (max 16)

  # 18F/18G/18H Niagara particle FX — asset paths authored in UE editor
  niagara_rotor_wash: "/Game/Effects/NS_RotorWash"
  niagara_smoke:      "/Game/Effects/NS_Smoke"
  niagara_fire:       "/Game/Effects/NS_Fire"
  niagara_contrail:   "/Game/Effects/NS_Contrail"
  contrail_alt_m: 8000.0    # metres — altitude above which contrails form
  contrail_speed_ms: 100.0  # reserved for future use (speed data not in CIGI entity state)
  smoke_component_id: 1     # CIGI Component Control CompId -> smoke
  fire_component_id: 2      # CIGI Component Control CompId -> fire

  # 18I Decal cratering
  crater_decal_material: "/Game/Effects/M_Crater"
  crater_impact_component_id: 10
  max_craters: 32
  crater_default_radius_m: 5.0

phase19:
  # 19A Ocean surface — GPU Gerstner waves via Material WPO
  ocean_enabled: false
  beaufort_state: 0          # 0-12; used when no CIGI Wave Control packet arrives
  wave_amplitude_scale: 1.0
  wave_frequency_scale: 1.0
  wave_choppiness: 0.5       # 0=sine waves, 1=sharp Gerstner peaks
  ocean_material_path: "/Game/Materials/M_Ocean"
  # 19B Vessel wake particle trails
  vessel_wakes_enabled: false
  niagara_vessel_wake: "/Game/Effects/NS_VesselWake"
  wake_fade_time: 8.0        # seconds before wake dissipates
  # 19C Vessel surface motion (pitch/roll/heave)
  vessel_motion_enabled: false
  vessel_motion_scale: 1.0
  # 19D Ocean reflections (SSR + SkyLight capture)
  ocean_reflections_enabled: false
  ssr_intensity: 1.0
  reflection_capture_radius: 10000.0  # cm (UE units)

# Phase 27 — Performance & Optimization
performance:
  # 27B Frame drop categorization (log drops by cause: encoder_busy, readback_timeout, socket_error)
  track_frame_drops_by_category: false         # CAMSIM_PERF_TRACK_DROPS

  # 27D Hot-reload config (apply YAML changes at runtime without restart)
  hot_reload_config: false                      # CAMSIM_PERF_HOT_RELOAD
  hot_reload_poll_interval_sec: 5.0             # CAMSIM_PERF_POLL_INTERVAL

  # 27E Tile prefetch (boost Cesium LOD during fast gimbal slews)
  tile_prefetch_slew_threshold_deg_per_sec: 10.0  # CAMSIM_PERF_TILE_SLEW_THRESHOLD
  tile_prefetch_fov_boost: 1.0                    # CAMSIM_PERF_TILE_FOV_BOOST
  tile_prefetch_boost_frames: 30                  # CAMSIM_PERF_TILE_BOOST_FRAMES

  # 27F Configurable frame rate
  render_frame_rate_hz: 30.0                    # CAMSIM_PERF_RENDER_FPS
  output_frame_rate_hz: 30.0                    # CAMSIM_PERF_OUTPUT_FPS

  # 27G Texture streaming pool (0 = engine default)
  texture_pool_budget_mb: 0                     # CAMSIM_PERF_TEXTURE_POOL_MB

  # 27A GPU sensor pipeline (requires editor material M_SensorPostProcess + MPC_SensorParams)
  gpu_sensor_effects: false                     # CAMSIM_PERF_GPU_SENSOR
  gpu_sensor_material_path: "/Game/CamSim/Materials/M_SensorPostProcess"
  gpu_sensor_mpc_path: "/Game/CamSim/Materials/MPC_SensorParams"

  # Adaptive SSE — dynamically adjust Cesium LOD based on frame budget
  adaptive_sse: false                        # CAMSIM_PERF_ADAPTIVE_SSE
  adaptive_sse_min: 8.0                      # CAMSIM_PERF_ADAPTIVE_SSE_MIN (sharpest allowed)
  adaptive_sse_max: 24.0                     # CAMSIM_PERF_ADAPTIVE_SSE_MAX (coarsest allowed)

  # Phase 28G: Per-frame pipeline latency tracking (P50/P95/P99 to health + Prometheus).
  # Env: CAMSIM_TRACK_PIPELINE_LATENCY
  track_pipeline_latency: false

# --- Cesium Backend ---
# Ion server, terrain source, and imagery overlay.
# Set ion_token to authenticate against Cesium ion (https://ion.cesium.com/tokens).
# For air-gapped deployments, set ion_portal_url and ion_api_url to your self-hosted server.
# Env: CAMSIM_CESIUM_ION_PORTAL_URL, CAMSIM_CESIUM_ION_API_URL, CAMSIM_CESIUM_ION_TOKEN,
#      CAMSIM_CESIUM_TERRAIN_SOURCE, CAMSIM_CESIUM_TERRAIN_ION_ASSET_ID, CAMSIM_CESIUM_TERRAIN_URL,
#      CAMSIM_CESIUM_IMAGERY_SOURCE, CAMSIM_CESIUM_IMAGERY_ION_ASSET_ID,
#      CAMSIM_CESIUM_IMAGERY_WMS_URL, CAMSIM_CESIUM_IMAGERY_WMS_LAYERS,
#      CAMSIM_CESIUM_IMAGERY_WMS_TILE_WIDTH, CAMSIM_CESIUM_IMAGERY_WMS_TILE_HEIGHT,
#      CAMSIM_CESIUM_IMAGERY_MAX_SSE, CAMSIM_CESIUM_IMAGERY_MAX_TEXTURE_SIZE,
#      CAMSIM_CESIUM_IMAGERY_MAX_TILE_LOADS
cesium:
  ion_portal_url: "https://ion.cesium.com"   # UCesiumIonServer::ServerUrl (OAuth/browser)
  ion_api_url:    "https://api.cesium.com"    # UCesiumIonServer::ApiUrl (REST tile API)
  ion_token: ""                               # leave empty to use level asset default

  terrain:
    source: cesium_ion    # cesium_ion | url | flat
    ion_asset_id: 1       # Cesium World Terrain (ignored unless source: cesium_ion)
    url: ""               # quantized-mesh endpoint (ignored unless source: url)

  imagery:
    source: cesium_ion    # cesium_ion | wms | none
    ion_asset_id: 2       # Bing Maps Aerial (ignored unless source: cesium_ion)
    wms_url: ""           # ignored unless source: wms
    wms_layers: ""        # ignored unless source: wms
    wms_tile_width: 256
    wms_tile_height: 256
    # Overlay SSE: controls imagery resolution. 2.0 = 1 source px covers 2x2 screen px,
    # 1.0 = 1:1 pixel mapping (sharpest for ISR). Plugin default 2.0.
    # Env: CAMSIM_CESIUM_IMAGERY_MAX_SSE
    maximum_screen_space_error: 2.0
    # Maximum texture size per raster overlay tile (pixels per side).
    # 2048 is Cesium plugin default. 4096 doubles texel density but is overkill at 720p.
    # Env: CAMSIM_CESIUM_IMAGERY_MAX_TEXTURE_SIZE
    maximum_texture_size: 2048
    # Maximum simultaneous HTTP requests for imagery overlay tiles.
    # Plugin default 20; keep low for real-time 30fps.
    # Env: CAMSIM_CESIUM_IMAGERY_MAX_TILE_LOADS
    maximum_simultaneous_tile_loads: 20

# --- HUD/OSD Overlay (Phase 20) ---
# Burn-in overlay for ISR display: reticle, telemetry readouts, classification banner.
# Master switch enabled=false keeps frames clean for ML training.
# Env: CAMSIM_OVERLAY_ENABLED, CAMSIM_OVERLAY_CROSSHAIR, CAMSIM_OVERLAY_AZEL,
#      CAMSIM_OVERLAY_FOV, CAMSIM_OVERLAY_SLANT_RANGE, CAMSIM_OVERLAY_TIMESTAMP,
#      CAMSIM_OVERLAY_CLASS_BANNER, CAMSIM_OVERLAY_CLASS_TEXT,
#      CAMSIM_OVERLAY_PRESET, CAMSIM_OVERLAY_COMPASS_ROSE, CAMSIM_OVERLAY_PLATFORM_LABEL
overlay:
  enabled: true             # master switch; set true for ISR output with HUD burn-in
  preset: ""                # mq9 | mq1c | rq7b — seeds all defaults; individual keys override
  crosshair: true           # 20A targeting reticle
  crosshair_style: mil_dot  # simple_cross | mil_dot | circle
  az_el_readout: true       # 20B gimbal azimuth/elevation (top-left)
  fov_indicator: true       # 20C FOV readout (top-right)
  slant_range: true         # 20D slant range to target (bottom-left)
  timestamp: true           # 20E DTG timestamp (bottom-center)
  class_banner: true        # 20E classification banner (top/bottom bar)
  classification_text: "UNCLASSIFIED"
  compass_rose: false       # 20F linear heading tape (bottom-center); enable for ISR
  platform_label: ""        # 20G platform identifier text; e.g. "MQ-9"; empty = disabled
  text_scale: 2             # 1=5x7 native, 2=10x14 (recommended for 1080p)
  edge_margin_px: 10        # pixels between frame edge and HUD elements
  # Per-element color overrides (hex RRGGBB; empty = sensor-mode default):
  # compass_rose_color: ""
  # platform_label_color: ""
  # Per-element position overrides (-1 = use default anchor):
  # az_el_x: -1
  # az_el_y: -1
  # fov_x: -1
  # fov_y: -1
  # slant_range_x: -1
  # slant_range_y: -1
  # timestamp_x: -1
  # timestamp_y: -1
  # compass_rose_x: -1
  # compass_rose_y: -1
  # platform_label_x: -1
  # platform_label_y: -1

# --- Security Metadata (MISB ST 0102) ---
# Embedded in every KLV packet as ST 0601 Tag 48.
# Required for STANAG 4609 compliance even for unclassified output.
# Env: CAMSIM_SECURITY_CLASSIFICATION, CAMSIM_SECURITY_CLASSIFYING_COUNTRY,
#      CAMSIM_SECURITY_OBJECT_COUNTRY
security_metadata:
  classification: "UNCLASSIFIED"
  classifying_country: "//US"
  object_country_codes: "US"
  caveats: ""
  releasing_instructions: ""

# --- Prometheus Metrics ---
# Path to write Prometheus node_exporter textfile-collector compatible metrics.
# Empty = disabled.
# Env: CAMSIM_PROMETHEUS_METRICS_PATH
prometheus_metrics_path: ""

# --- Recording & Playback ---
# Record CIGI input and/or video output for offline analysis and replay.
# Env: CAMSIM_CIGI_RECORD_PATH, CAMSIM_VIDEO_RECORD_PATH, CAMSIM_CIGI_PLAYBACK_PATH
recording:
  # Binary file: raw CIGI UDP datagrams with timestamps for deterministic replay.
  cigi_record_path: ""
  # Local MPEG-TS file: H.264/H.265 video + KLV metadata mirror of the UDP stream.
  video_record_path: ""
  # When set, CigiReceiver reads from this file instead of UDP socket (playback mode).
  cigi_playback_path: ""

# --- Damage Transition FX (Phase 22C) ---
# Controls visual damage transition effects when entity state changes.
# Env: CAMSIM_DAMAGE_TRANSITION_FX, CAMSIM_DAMAGE_GRADUAL,
#      CAMSIM_DAMAGE_INTERPOLATION_SEC
damage_transition:
  # Master toggle for damage transition particle FX (smoke on damaged, fire on destroyed).
  enabled: true
  # Gradual damage: interpolate mesh swap over time instead of instant.
  gradual: false
  # Interpolation duration in seconds (only when gradual: true).
  interpolation_sec: 1.0
  # Scorch darkening factor applied during gradual blend (0.0 = none, 1.0 = full black).
  scorch_darkening: 0.3

# --- Phase 28: Operational Hardening ---

# Structured JSON logging sidecar for ELK/Datadog/Splunk ingestion.
# Set to a file path to enable (e.g., /var/log/camsim.jsonl).
# Env: CAMSIM_STRUCTURED_LOG_PATH
operational:
  structured_log_path: ""

  # Max file size in MB before rotation (close, rename .1, reopen).
  # Env: CAMSIM_STRUCTURED_LOG_MAX_MB
  structured_log_max_mb: 100

  # HTTP health endpoints for Kubernetes liveness/readiness probes.
  # GET /live — 200 if game loop ticking, 503 if stalled
  # GET /ready — 200 when encoder + CIGI + first frame all OK
  # GET /metrics — Prometheus exposition format
  # Env: CAMSIM_HEALTH_HTTP_ENABLED / CAMSIM_HEALTH_HTTP_PORT
  health_http_enabled: false
  health_http_port: 8080

# --- Entity Types ---
# Maps CIGI EntityType uint16 to asset paths.
# Use .gltf/.glb paths (relative to entities/) for runtime loading,
# or /Game/... UE content paths for cooked assets.
# "scale": uniform scale factor (default 1.0).
# "rotation": pitch/yaw/roll offset in degrees to correct model-space orientation.
# Phase 22D: "animated: true" + "anim_blueprint:" for skeletal character animation.
# Phase 22A: "entity_category:" for type classification ("character"|"vehicle"|"").
entity_types:
  "1001":
    mesh: f16/f16-c_falcon.glb
    skeletal: false
    scale: 1.0
    rotation:
      pitch: 0.0
      yaw: 0.0
      roll: 0.0
  # Example animated character entity (Phase 22D).
  # Requires skeletal mesh + Animation Blueprint assets in UE editor (see TODO.md).
  # "1010":
  #   mesh: /Game/Characters/SK_Soldier.SK_Soldier
  #   skeletal: true
  #   animated: true
  #   anim_blueprint: /Game/Characters/ABP_Soldier.ABP_Soldier_C
  #   entity_category: character
  #   scale: 1.0
  #   rotation:
  #     pitch: 0.0
  #     yaw: 0.0
  #     roll: 0.0
