name: CamSim CI

on:
  push:
    branches: [main, refactor, "release/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 6am UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # -------------------------------------------------------------------
  # Phase 14C: Code quality checks (fast, no build)
  # -------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install tools
        run: |
          uv tool install ruff
          uv tool install yamllint
          sudo apt-get install -y clang-format-17 || true

      - name: Python lint (ruff)
        run: ruff check scripts/ --output-format github

      - name: Python format (ruff)
        run: ruff format --check scripts/

      - name: YAML lint
        run: yamllint -d relaxed deploy/camsim_config.yaml

      - name: C++ format check (clang-format)
        run: |
          SOURCES=$(find unreal_project/CamSimTest/Source/CamSimTest -name '*.cpp' -o -name '*.h' | grep -v ryml)
          if [ -n "$SOURCES" ]; then
            clang-format-17 --dry-run --Werror $SOURCES 2>&1 || echo "::warning::C++ format issues found"
          fi
        continue-on-error: true

  # -------------------------------------------------------------------
  # Phase 14A: Build thirdparty libraries (cached)
  # -------------------------------------------------------------------
  build-thirdparty:
    name: Build ThirdParty (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache ThirdParty
        uses: actions/cache@v4
        id: thirdparty-cache
        with:
          path: |
            unreal_project/CamSimTest/Source/ThirdParty/CCL/lib/Linux/
            unreal_project/CamSimTest/Source/ThirdParty/CCL/include/
            unreal_project/CamSimTest/Source/ThirdParty/FFmpeg/lib/Linux/
            unreal_project/CamSimTest/Source/ThirdParty/FFmpeg/include/
          key: thirdparty-linux-${{ hashFiles('scripts/build_thirdparty_linux.sh') }}

      - name: Install build dependencies
        if: steps.thirdparty-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm yasm pkg-config \
            libx264-dev libssl-dev

      - name: Build ThirdParty
        if: steps.thirdparty-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_thirdparty_linux.sh

  # -------------------------------------------------------------------
  # Phase 14A: Python validation scripts
  # -------------------------------------------------------------------
  python-tests:
    name: Python Validation Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Validate KLV parser (import + --help smoke)
        run: uv run scripts/validate_klv.py --help

      - name: Validate CIGI test sender (import + --help smoke)
        run: uv run scripts/send_cigi_test.py --help

      - name: Unit tests (scripts/tests)
        run: uv run --with pytest pytest scripts/tests/ -v

  # -------------------------------------------------------------------
  # Phase 28A: Docker image build (self-hosted runner with UE5)
  #
  # deploy/Dockerfile COPYs deploy/staged/LinuxNoEditor/, which is the
  # output of UE5 RunUAT.sh BuildCookRun. The self-hosted runner labelled
  # `camsim-ue5` has UE5.7 installed at /opt/UE; scripts/package_for_docker.sh
  # invokes BuildCookRun and copies the staged output into deploy/staged/
  # before the docker build runs.
  #
  # unit-tests, integration-test, and docker-release are all gated behind
  # the same CAMSIM_UE5_RUNNER_AVAILABLE repo variable as a manual
  # kill-switch. Each job bootstraps its own staged build / compose stack,
  # so they do not consume an artifact from this job.
  # -------------------------------------------------------------------
  docker-build:
    name: Build Docker Image
    runs-on: [self-hosted, camsim-ue5]
    needs: [lint]
    if: ${{ vars.CAMSIM_UE5_RUNNER_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ThirdParty libs (cached)
        run: bash scripts/build_thirdparty_linux.sh

      - name: Package CamSim (RunUAT BuildCookRun)
        run: bash scripts/package_for_docker.sh
        timeout-minutes: 45

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: deploy/
          push: false
          tags: camsim:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup staged tree
        if: always()
        run: rm -rf deploy/staged

  # -------------------------------------------------------------------
  # Phase 28A: UE5 unit tests (editor target, headless, NullRHI)
  #
  # Runs directly on a self-hosted runner with UE5.7 at /opt/UE — no Docker.
  # Builds the editor target with scripts/run.sh --build-only, then runs the
  # Automation RunTests CamSim+Quit suite (~185 tests, ~10 s) and parses the
  # JSON report with scripts/parse_automation_report.py.
  #
  # Gated on CAMSIM_UE5_RUNNER_AVAILABLE as a manual kill-switch (see
  # docker-build rationale).
  # -------------------------------------------------------------------
  unit-tests:
    name: UE5 Unit Tests
    runs-on: [self-hosted, camsim-ue5]
    needs: [lint]
    if: ${{ vars.CAMSIM_UE5_RUNNER_AVAILABLE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ThirdParty libs (cached)
        run: bash scripts/build_thirdparty_linux.sh

      - name: Build editor target
        run: bash scripts/run.sh --build-only
        timeout-minutes: 20

      - name: Locate UnrealEditor
        id: ue
        run: |
          BIN="$(find /opt -maxdepth 6 -path '*/Binaries/Linux/UnrealEditor' 2>/dev/null | head -n1)"
          if [ -z "$BIN" ]; then
            echo "::error::UnrealEditor not found under /opt"
            exit 1
          fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Run UE5 automation tests
        env:
          UE_BIN: ${{ steps.ue.outputs.bin }}
        run: |
          rm -rf .cache/automation-report
          "$UE_BIN" \
            "$PWD/unreal_project/CamSimTest/CamSimTest.uproject" \
            -ExecCmds="Automation RunTests CamSim+Quit" \
            -TestExit="Automation Test Queue Empty" \
            -ReportExportPath="$PWD/.cache/automation-report" \
            -unattended -nullrhi -nosound -nosplash \
            -log -stdout -FullStdOutLogOutput
        timeout-minutes: 10

      - name: Parse automation report
        run: python3 scripts/parse_automation_report.py .cache/automation-report

      - name: Upload automation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue5-automation-report
          path: .cache/automation-report/
          if-no-files-found: warn

      - name: Cleanup automation report
        if: always()
        run: rm -rf .cache/automation-report

  # -------------------------------------------------------------------
  # Phase 28A: Integration test (packaged Docker, headless)
  #
  # Runs on the self-hosted runner with UE5: packages the project via
  # RunUAT BuildCookRun (~5-30 min depending on cache state), then brings
  # the docker compose stack up and validates video / KLV output.
  #
  # Gated on CAMSIM_UE5_RUNNER_AVAILABLE (see docker-build rationale) and
  # additionally branch-gated to pushes to main to keep PRs fast.
  # -------------------------------------------------------------------
  integration-test:
    name: Integration Test
    runs-on: [self-hosted, camsim-ue5]
    needs: [lint]
    if: >-
      ${{ vars.CAMSIM_UE5_RUNNER_AVAILABLE == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build ThirdParty libs (cached)
        run: bash scripts/build_thirdparty_linux.sh

      - name: Package CamSim (RunUAT BuildCookRun)
        run: bash scripts/package_for_docker.sh
        timeout-minutes: 45

      - name: Build and start CamSim (headless)
        run: |
          cd deploy
          docker compose up -d --build
        timeout-minutes: 15

      - name: Wait for health file
        run: |
          for i in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.yml exec camsim test -f /opt/camsim/camsim_health.json; then
              echo "Health file found"
              exit 0
            fi
            sleep 2
          done
          echo "Health file not found after 60s"
          exit 1

      - name: Run CI validation
        run: bash scripts/ci_validate.sh || true

      - name: Collect logs
        if: always()
        run: docker compose -f deploy/docker-compose.yml logs > docker-logs.txt 2>&1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

      - name: Cleanup staged tree
        if: always()
        run: rm -rf deploy/staged

  # -------------------------------------------------------------------
  # Phase 28A: Docker image versioning + registry push (releases only)
  #
  # Runs on the self-hosted runner with UE5: stages the LinuxNoEditor
  # build via scripts/package_for_docker.sh, then builds and pushes the
  # image to GHCR. Triggered by tag pushes only (see top-level `on:`).
  # -------------------------------------------------------------------
  docker-release:
    name: Push Docker Image
    runs-on: [self-hosted, camsim-ue5]
    needs: [lint, python-tests]
    if: ${{ vars.CAMSIM_UE5_RUNNER_AVAILABLE == 'true' }}
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build ThirdParty libs (cached)
        run: bash scripts/build_thirdparty_linux.sh

      - name: Package CamSim (RunUAT BuildCookRun)
        run: bash scripts/package_for_docker.sh
        timeout-minutes: 45

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: deploy/
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/camsim:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}/camsim:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup staged tree
        if: always()
        run: rm -rf deploy/staged
