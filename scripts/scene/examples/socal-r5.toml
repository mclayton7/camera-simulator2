# REALISM R5 gate package: 200 km x 200 km around Camp Pendleton at preview, the Pendleton bbox at sim (detail polygon);
# every other setting as pendleton-r5veg.toml
name = "socal-r5"
bbox = [-118.51, 32.46, -116.35, 34.25]  # W S E N
profile = "preview"
seed = 0
ring_km = 100
bmng_month = 7
jpeg_quality = 85
allow = ["ODbL-1.0"]       # OSM roads (REALISM R2), Overture buildings (REALISM R3)

[features]                 # REALISM R2: OSM roads / paved areas / rail + NHD water burned into land cover
roads = true
paved_areas = true
rail = true
water = true

[buildings]                # REALISM R3: Overture footprints -> features/buildings/ (3D Tiles 1.1); ODbL, in allow above
release = "2026-09-23.1"
roof_textures = true       # REALISM R3b: per-tile roof atlas from the imagery sources (flat grey without NAIP)
roof_texel_m = 0.5         # atlas texel; steps up 0.75 / 1.0 / 1.5 / 2.0 m when a tile's roofs do not fit
roof_texture_max_px = 2048 # largest atlas side (power of two)

[sources.naip_pc]
year = "2022"

[sea_level]
station = "9410230"  # NOAA CO-OPS La Jolla: MSL +0.774 m NAVD88 (1983-2001); Oceanside Harbor has no NAVD88 tie

[canopy]
enabled = true

# Camp Pendleton site mix (docs/vegetation.md, "Site mixes")
[vegetation]
mix.10 = { tree_broadleaf_a = 1.0, shrub_chaparral = 1.0 }
mix.20 = { shrub_chaparral = 0.8, shrub_desert = 0.2 }
mix.30 = { shrub_chaparral = 0.5, shrub_desert = 0.5, tree_broadleaf_a = 0.05 }
shrub_density.10 = 4.0
shrub_density.20 = 8.0
shrub_density.30 = 1.0

[detail]                   # REALISM R5: NAIP and 3DEP 1 m only inside these polygons
file = "socal-r5-detail.geojson"
profile = "sim"
