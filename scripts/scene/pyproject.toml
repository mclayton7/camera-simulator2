[project]
name = "camsim-scene"
version = "0.1.0"
description = "CamSim scene packages: terrain, imagery and land cover from public data (REALISM R0)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pydelatin>=0.3.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.scripts]
camsim-scene = "camsim_scene.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "quantized-mesh-encoder>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camsim_scene"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the internet (run with --network)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spike"]  # throwaway R0 spike, removed in a later task
