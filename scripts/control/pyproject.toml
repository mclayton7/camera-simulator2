[project]
name = "camsim-control"
version = "0.1.0"
description = "Client for CamSim's control API (ROADMAP 2.4): scene setup, lockstep clock, captures, COCO datasets"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camsim_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
